  <title>Brass Knuckles v1.0.0</title>
  <style>
/* ===========================================================================
   Brass Knuckles: gunmetal chassis, polished-brass accents.
   Same structure as E-Piano's stylesheet; every colour is a token below.
   =========================================================================== */
:root {
  --bg: #0c0d0f;
  --chassis-1: #2a2e34;
  --chassis-2: #17191d;
  --panel: #1b1e22;
  --panel-2: #22262b;
  --panel-edge: #33383f;
  --panel-edge-hi: #474d56;
  --screen: #08090a;
  --text: #e8e6e1;
  --muted: #959aa2;
  --faint: #545961;
  --accent: #d9ad52;              /* polished brass */
  --accent-hi: #f3d48a;
  --accent-glow: rgba(217, 173, 82, 0.42);
  --accent-dim: #6b5321;
  --accent-bg: #2a2416;
  --track: #2c3036;
  --danger: #ff9c8a;
  --danger-bg: #2a1512;
  --danger-edge: #5b2a22;
  --ok: #7fc28f;
  --sans: "Segoe UI", system-ui, -apple-system, sans-serif;
  --mono: "Cascadia Mono", "Consolas", ui-monospace, monospace;
}

* { box-sizing: border-box; }
html, body { margin: 0; }
body {
  min-height: 100vh;
  background: radial-gradient(1200px 600px at 50% -10%, #1d2025 0%, var(--bg) 60%) var(--bg);
  color: var(--text);
  font-family: var(--sans);
  display: flex;
  justify-content: center;
  padding: 24px 16px;
  -webkit-font-smoothing: antialiased;
}
button { font-family: inherit; color: inherit; }

.synth {
  width: 100%;
  min-width: 0;
  max-width: 1180px;
  /* gunmetal: a faint brushed grain over a cool steel gradient */
  background:
    repeating-linear-gradient(90deg, rgba(255, 255, 255, 0.012) 0 1px, transparent 1px 3px),
    linear-gradient(180deg, var(--chassis-1), var(--chassis-2));
  border: 1px solid var(--panel-edge);
  border-radius: 16px;
  padding: 18px;
  box-shadow: 0 30px 80px rgba(0, 0, 0, 0.6), inset 0 1px 0 rgba(255, 255, 255, 0.07);
  display: flex;
  flex-direction: column;
  gap: 14px;
  user-select: none;
}

/* ---------------------------------------------------------------- LEDs --- */
.led {
  display: inline-block;
  width: 8px; height: 8px;
  border-radius: 50%;
  background: #2a2721;
  box-shadow: inset 0 1px 1px rgba(0, 0, 0, 0.6);
  flex: none;
  transition: background 60ms, box-shadow 60ms;
}
.led.on, .power.on .led {
  background: var(--accent);
  box-shadow: 0 0 8px var(--accent-glow), 0 0 2px var(--accent);
}

.ctl-label, .panel-title, .knob-label, .pd-label, .vs-label {
  font-size: 10px;
  letter-spacing: 0.14em;
  text-transform: uppercase;
  color: var(--muted);
  font-weight: 600;
}

/* -------------------------------------------------------------- top bar --- */
.topbar { display: flex; align-items: center; gap: 16px; flex-wrap: wrap; }
.brand { display: flex; align-items: center; gap: 10px; line-height: 1.1; }
.brand-logo { width: 34px; height: 34px; flex: none; }
.brand-logo .bl-metal { fill: url(#bk-metal); }
.brand-logo .bk-s1 { stop-color: var(--accent-hi); }
.brand-logo .bk-s2 { stop-color: var(--accent); }
.brand-logo .bk-s3 { stop-color: #9c7a2f; }
.brand-logo .bl-bevel { fill: none; stroke: #9c7a2f; stroke-width: 0.7; }
.brand-text { display: flex; flex-direction: column; }
.brand-mark {
  font-size: 19px; font-weight: 800; letter-spacing: 0.16em;
  background: linear-gradient(180deg, var(--accent-hi), var(--accent) 55%, #9c7a2f);
  -webkit-background-clip: text; background-clip: text; color: transparent;
}
.brand-sub { font-size: 9.5px; letter-spacing: 0.22em; color: var(--muted); margin-top: 3px; }

.patch-display {
  flex: 1;
  min-width: 200px;
  display: flex;
  align-items: center;
  gap: 6px;
  background: var(--screen);
  border: 1px solid #000;
  border-radius: 6px;
  padding: 5px 6px;
  box-shadow: inset 0 2px 6px rgba(0, 0, 0, 0.8);
}
.pd-text { flex: 1; min-width: 0; display: flex; align-items: baseline; gap: 10px; padding: 0 4px; }
.pd-name {
  font-family: var(--mono); color: var(--accent); font-size: 15px; text-shadow: 0 0 8px var(--accent-glow);
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.pd-step {
  flex: none; width: 26px; height: 26px; padding: 0;
  display: flex; align-items: center; justify-content: center;
  background: #15171a; border: 1px solid var(--panel-edge); border-radius: 5px; cursor: pointer;
}
.pd-step svg { width: 12px; height: 12px; fill: none; stroke: var(--muted); stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
.pd-step:hover svg { stroke: var(--accent); }
.pd-step:active { transform: translateY(1px); }

.preset-actions { display: flex; gap: 6px; }
.pd-btn {
  background: linear-gradient(180deg, #2a2e34, #1e2125);
  border: 1px solid var(--panel-edge);
  border-radius: 6px;
  padding: 6px 11px;
  font-size: 11px; font-weight: 700; letter-spacing: 0.12em;
  color: var(--text);
  cursor: pointer;
}
.pd-btn:hover { border-color: var(--panel-edge-hi); }
.pd-btn:active { transform: translateY(1px); }
.pd-btn.primary { background: linear-gradient(180deg, #3a3120, #282215); border-color: var(--accent-dim); color: var(--accent); }
.pd-btn.primary:hover { border-color: var(--accent); }
.pd-btn.danger { background: var(--danger-bg); border-color: var(--danger-edge); color: var(--danger); }

.top-controls { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; }
.midi-pick { display: flex; align-items: center; gap: 8px; }
.midi-pick select {
  background: var(--screen); color: var(--text);
  border: 1px solid var(--panel-edge); border-radius: 5px;
  padding: 5px 8px; font: 12px var(--sans); max-width: 200px;
}
.indicator { display: flex; align-items: center; gap: 6px; font-size: 10px; letter-spacing: 0.14em; color: var(--muted); font-weight: 600; }
.mini-meter { width: 44px; height: 6px; background: #121418; border: 1px solid #000; border-radius: 3px; overflow: hidden; }
.mini-meter > div { height: 100%; width: 0%; background: linear-gradient(90deg, var(--accent-dim), var(--accent)); transition: width 60ms linear; }
.indicator.absent { opacity: 0.45; }

.panic {
  background: var(--danger-bg); border: 1px solid var(--danger-edge); color: var(--danger);
  border-radius: 6px; padding: 6px 12px;
  font-size: 11px; letter-spacing: 0.14em; font-weight: 700; cursor: pointer;
}
.panic:hover { background: #3a1a15; }
.panic:active { transform: translateY(1px); }

/* ======================================================== preset browser === */
.browser {
  background: var(--panel); border: 1px solid var(--panel-edge); border-radius: 10px;
  padding: 8px; display: flex; flex-direction: column; gap: 8px;
}
.cat-tabs { display: flex; flex-wrap: wrap; gap: 3px; }
.cat-tab {
  position: relative; background: transparent; border: 1px solid transparent; border-radius: 5px;
  padding: 4px 8px; font-size: 10px; font-weight: 700; letter-spacing: 0.1em; text-transform: uppercase;
  color: var(--muted); cursor: pointer;
}
.cat-tab:hover { color: var(--text); }
.cat-tab.active { color: var(--accent); border-color: var(--accent-dim); background: var(--accent-bg); }
.cat-tab.has-current::after {
  content: ""; position: absolute; top: 3px; right: 3px;
  width: 4px; height: 4px; border-radius: 50%; background: var(--accent);
}
.preset-grid {
  display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); grid-auto-rows: 30px; gap: 6px;
  height: 66px; overflow-y: auto; padding-right: 2px;
}
.preset-btn {
  position: relative; display: flex; align-items: center; padding: 0 24px 0 10px;
  background: linear-gradient(180deg, #262a30, #1c1f23);
  border: 1px solid var(--panel-edge); border-radius: 6px;
  font-size: 12px; font-weight: 600; text-align: left; cursor: pointer; min-width: 0;
}
.preset-btn:hover { border-color: var(--panel-edge-hi); }
.preset-btn:active { transform: translateY(1px); }
.preset-btn.selected { border-color: var(--accent); background: linear-gradient(180deg, #30291b, #201c14); color: var(--accent); }
.pb-name { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.pb-del {
  position: absolute; right: 4px; top: 50%; transform: translateY(-50%);
  width: 18px; height: 18px; line-height: 17px; text-align: center;
  border-radius: 4px; color: var(--muted); font-size: 14px; opacity: 0;
}
.preset-btn:hover .pb-del { opacity: 1; }
.pb-del:hover { background: #3a1a15; color: var(--danger); }
.grid-empty { grid-column: 1 / -1; grid-row: 1 / 3; align-self: center; font-size: 12px; color: var(--muted); line-height: 1.6; padding: 0 4px; }
.path { font-family: var(--mono); color: var(--text); font-size: 11px; word-break: break-all; }
.preset-grid::-webkit-scrollbar { width: 6px; }
.preset-grid::-webkit-scrollbar-thumb { background: #353a41; border-radius: 3px; }

/* ============================================================ page tabs === */
.page-tabs { display: flex; align-items: center; gap: 4px; border-bottom: 1px solid var(--panel-edge); padding: 0 2px; margin-bottom: -6px; }
.page-tab {
  display: flex; align-items: center; gap: 7px;
  background: transparent; border: 1px solid transparent; border-bottom: none; border-radius: 7px 7px 0 0;
  padding: 7px 14px 6px; font-size: 11px; font-weight: 700; letter-spacing: 0.16em;
  color: var(--muted); cursor: pointer; position: relative; top: 1px;
}
.page-tab:hover { color: var(--text); }
.page-tab.active { color: var(--accent); background: var(--panel); border-color: var(--panel-edge); }
.page-tab { white-space: nowrap; flex: none; padding-left: 12px; padding-right: 12px; }
.page-hint { margin-left: auto; font-size: 10px; color: var(--faint); letter-spacing: 0.04em; padding: 0 4px 0 10px;
             min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.pages { display: grid; }
.page { grid-area: 1 / 1; display: flex; flex-direction: column; gap: 12px; min-width: 0; }
.page:not(.active) { visibility: hidden; pointer-events: none; }

/* --------------------------------------------------------------- panels --- */
.row { display: grid; gap: 12px; }
.play-row-1 { grid-template-columns: minmax(0, 0.8fr) minmax(0, 1.6fr); }
.play-row-2 { grid-template-columns: minmax(0, 1.15fr) minmax(0, 1.1fr) minmax(0, 0.5fr); }
.osc-row { grid-template-columns: repeat(3, minmax(0, 1fr)); }
.filter-row { grid-template-columns: minmax(0, 1fr); }
.harm-row-1 { grid-template-columns: minmax(0, 1.5fr) minmax(0, 1fr); }
.harm-row-2 { grid-template-columns: repeat(3, minmax(0, 1fr)); }
.tone-row { grid-template-columns: repeat(3, minmax(0, 1fr)); }
.attack-row-1 { grid-template-columns: minmax(0, 0.7fr) minmax(0, 1fr) minmax(0, 1fr); }
.attack-row-2 { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr) minmax(0, 0.7fr); }

.perform-row-1 { grid-template-columns: minmax(0, 1.9fr) minmax(0, 0.8fr); }
.perform-row-2 { grid-template-columns: minmax(0, 1.5fr) minmax(0, 1fr) minmax(0, 0.7fr); }

.mod-row { grid-template-columns: minmax(0, 0.62fr) minmax(0, 1.9fr); }
.lfo-col { display: flex; flex-direction: column; gap: 12px; min-width: 0; }
.fx-row-1 { grid-template-columns: minmax(0, 1fr) minmax(0, 1.6fr); }
.fx-row-2 { grid-template-columns: minmax(0, 1fr) minmax(0, 1.5fr) minmax(0, 0.5fr); }
.lfo-panel .screen { height: 48px; }

/* mod matrix: 12 routes in two columns */
.mx-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 6px 12px; }
.mx-row {
  display: grid; grid-template-columns: 22px minmax(0, 1fr) minmax(0, 0.9fr) minmax(0, 1fr) 34px 46px;
  align-items: center; gap: 5px; background: #15171a; border: 1px solid #23262b; border-radius: 7px; padding: 3px 5px;
}
.mx-row.off .param-select, .mx-row.off .knob, .mx-row.off .mx-amt-text { opacity: 0.4; }
.mx-num { font-family: var(--mono); font-size: 10px; color: var(--faint); text-align: center; cursor: pointer; }
.mx-row.on .mx-num { color: var(--accent); }
.mx-amt-text { font-family: var(--mono); font-size: 10px; color: var(--text); text-align: right; white-space: nowrap; }
.mx-head { display: grid; grid-template-columns: 22px minmax(0, 1fr) minmax(0, 0.9fr) minmax(0, 1fr) 34px 46px; gap: 5px; padding: 0 6px; }
.mx-head span { font-size: 8.5px; font-weight: 700; letter-spacing: 0.14em; color: var(--faint); }
.mx-note { font-size: 10px; color: var(--faint); line-height: 1.5; }

/* articulation picker */
.art-buttons { display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); gap: 6px; }
.art-btn {
  display: flex; flex-direction: column; align-items: center; gap: 3px;
  background: linear-gradient(180deg, #262a30, #1c1f23); border: 1px solid var(--panel-edge); border-radius: 7px;
  padding: 6px 4px; cursor: pointer; font-size: 10.5px; font-weight: 700; letter-spacing: 0.12em; color: var(--muted);
}
.art-btn svg { width: 38px; height: 18px; fill: none; stroke: currentColor; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; }
.art-btn .ks { font-family: var(--mono); font-size: 9px; font-weight: 400; letter-spacing: 0; color: var(--faint); }
.art-btn:hover { border-color: var(--panel-edge-hi); color: var(--text); }
.art-btn.on { border-color: var(--accent); color: var(--accent); background: linear-gradient(180deg, #30291b, #201c14); }
.players-graph { height: 70px; }
.pl-dot { fill: var(--accent); filter: drop-shadow(0 0 3px var(--accent-glow)); }
.pl-dot.lead { fill: var(--accent-hi); }
.wkey.ks-active, .bkey.ks-active { fill: #9fd0ee; }

/* graphs on the HARMONICS / TONE pages */
.graph { position: relative; height: 110px; background: var(--screen); border: 1px solid #000; border-radius: 6px; box-shadow: inset 0 2px 8px rgba(0, 0, 0, 0.9); overflow: hidden; }
.graph.tall { height: 150px; }
.graph svg { position: absolute; inset: 0; width: 100%; height: 100%; }
.gr-bar-soft { fill: #4d4a42; }
.gr-bar-loud { fill: var(--accent); filter: drop-shadow(0 0 2px var(--accent-glow)); }
.gr-line { fill: none; stroke: var(--accent); stroke-width: 1.7; vector-effect: non-scaling-stroke; filter: drop-shadow(0 0 3px var(--accent-glow)); }
.gr-line.dim { stroke: var(--muted); filter: none; stroke-width: 1.2; }
.gr-line.mid { stroke: #b48a3a; filter: none; }
.gr-zero { stroke: #2b3036; stroke-width: 1; stroke-dasharray: 3 3; vector-effect: non-scaling-stroke; }
.gr-grid { stroke: #171a1e; stroke-width: 1; vector-effect: non-scaling-stroke; }
.gr-mark { stroke: #f4f4f4; stroke-width: 1; opacity: 0.6; vector-effect: non-scaling-stroke; }
.gr-label { fill: var(--faint); font: 600 9px var(--sans); letter-spacing: 0.08em; }
.gr-legend { position: absolute; right: 6px; top: 4px; font-family: var(--mono); font-size: 9.5px; color: var(--muted); background: rgba(8, 9, 10, 0.75); padding: 1px 4px; border-radius: 3px; }
.gr-legend b { color: var(--accent); font-weight: 400; }
.dyn-slider { display: flex; align-items: center; gap: 8px; font-size: 9.5px; color: var(--muted); letter-spacing: 0.1em; font-weight: 700; }
.dyn-slider input { flex: 1; accent-color: var(--accent); }

.panel {
  background: linear-gradient(180deg, var(--panel-2), var(--panel));
  border: 1px solid var(--panel-edge);
  border-radius: 10px;
  padding: 10px 12px 12px;
  display: flex; flex-direction: column; gap: 10px;
  box-shadow: inset 0 1px 0 rgba(255, 255, 255, 0.04);
  transition: opacity 150ms;
  min-width: 0;
}
.panel.off .screen, .panel.off .knob-row, .panel.off .env-block { opacity: 0.38; }
.panel-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; min-height: 22px; }
.panel-title { color: var(--text); }
.panel-head .seg, .panel-head .param-select { flex: none; }

.power {
  display: flex; align-items: center; gap: 6px;
  background: #202328; border: 1px solid var(--panel-edge); border-radius: 5px;
  padding: 3px 8px; font-size: 10px; letter-spacing: 0.14em; font-weight: 700;
  color: var(--muted); cursor: pointer;
}
.power.on { color: var(--text); }

.screen {
  position: relative; background: var(--screen); border: 1px solid #000; border-radius: 6px;
  height: 56px; overflow: hidden; box-shadow: inset 0 2px 8px rgba(0, 0, 0, 0.9);
}
.screen svg { position: absolute; inset: 4px 0; width: 100%; height: calc(100% - 8px); }
.scr-grid { stroke: #1a1d22; stroke-width: 1; vector-effect: non-scaling-stroke; }
.scr-line {
  fill: none; stroke: var(--accent); stroke-width: 1.6; vector-effect: non-scaling-stroke;
  filter: drop-shadow(0 0 3px var(--accent-glow)); stroke-linejoin: round;
}
.scr-text {
  position: absolute; right: 8px; top: 5px;
  font-family: var(--mono); font-size: 10px; color: #cdd0d4;
  background: rgba(8, 9, 10, 0.75); padding: 1px 4px; border-radius: 3px;
}

/* ---- dynamics screen ------------------------------------------------------- */
.dyn-screen { height: 92px; display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)) minmax(0, 1.7fr); gap: 10px; padding: 8px 10px; align-items: stretch; }
.dyn-src { display: flex; flex-direction: column; align-items: center; gap: 4px; min-width: 0; }
.dyn-bar { flex: 1; width: 12px; background: #121418; border: 1px solid #000; border-radius: 3px; position: relative; overflow: hidden; }
.dyn-bar > div { position: absolute; left: 0; right: 0; bottom: 0; height: 0%; background: linear-gradient(0deg, var(--accent-dim), var(--accent)); transition: height 50ms linear; }
.dyn-src span { font-size: 9px; letter-spacing: 0.1em; color: var(--muted); font-weight: 700; }
.dyn-src.absent span { color: var(--faint); }
.dyn-src.absent .dyn-bar { opacity: 0.35; }
.dyn-src.out .dyn-bar > div { background: linear-gradient(0deg, #8a6a28, var(--accent-hi)); }
.dyn-curves { position: relative; border-left: 1px solid #1d2025; padding-left: 10px; }
.dyn-curves svg { position: absolute; inset: 0 0 0 10px; width: calc(100% - 10px); height: 100%; }
.dc-loud { fill: none; stroke: var(--muted); stroke-width: 1.4; vector-effect: non-scaling-stroke; }
.dc-bright { fill: none; stroke: var(--accent); stroke-width: 1.6; vector-effect: non-scaling-stroke; filter: drop-shadow(0 0 3px var(--accent-glow)); }
.dc-now { stroke: #f4f4f4; stroke-width: 1; opacity: 0.6; vector-effect: non-scaling-stroke; }
.dc-legend { position: absolute; right: 2px; top: 0; font-family: var(--mono); font-size: 9px; color: var(--muted); }
.dc-legend b { color: var(--accent); font-weight: 400; }

.voice-screen { display: flex; flex-direction: column; justify-content: center; gap: 8px; padding: 0 10px; height: 64px; }
.vs-row { display: flex; justify-content: space-between; align-items: baseline; }
.vs-value { font-family: var(--mono); color: var(--muted); font-size: 12px; }
.vs-value b { color: var(--accent); font-size: 16px; font-weight: 600; }
.meter { position: relative; height: 6px; background: #15171a; border-radius: 3px; overflow: hidden; }
#meter-fill { height: 100%; width: 0%; background: linear-gradient(90deg, #4f8a5c 0%, #c9a640 75%, #ff5a3d 100%); transition: width 60ms linear; }
.meter-clip { position: absolute; right: 0; top: 0; width: 6px; height: 100%; background: #3a1512; }
.meter-clip.on { background: #ff3b2f; box-shadow: 0 0 6px #ff3b2f; }

/* ---------------------------------------------------------------- knobs --- */
.knob-row { display: flex; justify-content: space-around; gap: 4px; flex-wrap: wrap; }
.knob-row.left { justify-content: flex-start; }
.knob { display: flex; flex-direction: column; align-items: center; gap: 2px; width: 64px; }
.knob-svg { width: 52px; height: 52px; cursor: ns-resize; touch-action: none; outline: none; overflow: visible; }
.knob-svg:focus-visible .k-face { stroke: var(--accent); }
.k-track { fill: none; stroke: var(--track); stroke-width: 4; stroke-linecap: round; }
.k-value { fill: none; stroke: var(--accent); stroke-width: 4; stroke-linecap: round; filter: drop-shadow(0 0 3px var(--accent-glow)); }
.k-tick { fill: var(--faint); }
.k-face { fill: url(#knobFace); stroke: #050607; stroke-width: 1.5; }
.k-pointer { stroke: var(--accent-hi); stroke-width: 2.6; stroke-linecap: round; }
.knob:hover .k-track { stroke: #383d44; }
.knob-value { font-family: var(--mono); font-size: 10.5px; color: var(--text); min-height: 14px; white-space: nowrap; }
.knob.active .knob-value { color: var(--accent); }
.knob-label { font-size: 9px; white-space: nowrap; }
/* medium knobs: dense panels (oscillator envelopes) */
.knob.knob-md { width: 54px; }
.knob.knob-md .knob-svg { width: 40px; height: 40px; }
.knob.knob-md .knob-value { font-size: 9.5px; }
.knob.knob-md .knob-label { font-size: 8.5px; letter-spacing: 0.08em; }
.knob.knob-sm { width: 34px; gap: 0; }
.knob.knob-sm .knob-svg { width: 32px; height: 32px; }
.knob.knob-sm .knob-label, .knob.knob-sm .knob-value { display: none; }
.knob.knob-sm .k-track, .knob.knob-sm .k-value { stroke-width: 5; }

/* -------------------------------------------------- switches / choices ---- */
.switch-row { display: flex; align-items: center; justify-content: space-between; gap: 6px; flex-wrap: wrap; }
.switch-row.left { justify-content: flex-start; gap: 10px; }
.seg { display: inline-flex; background: #111316; border: 1px solid var(--panel-edge); border-radius: 6px; padding: 2px; gap: 2px; }
.seg button {
  background: transparent; border: none; border-radius: 4px; padding: 4px 8px;
  font-size: 10px; font-weight: 700; letter-spacing: 0.1em; text-transform: uppercase;
  color: var(--muted); cursor: pointer;
}
.seg button:hover { color: var(--text); }
.seg button.on { background: var(--accent-bg); color: var(--accent); box-shadow: inset 0 0 0 1px var(--accent-dim); }
.seg button:focus-visible { outline: 1px solid var(--accent); }
.param-select {
  min-width: 0; width: 100%; background: var(--screen); color: var(--text);
  border: 1px solid var(--panel-edge); border-radius: 5px; padding: 4px 2px 4px 4px;
  font: 600 11px var(--sans); cursor: pointer;
}
.param-select:hover { border-color: var(--panel-edge-hi); }
.param-select:focus-visible { outline: 1px solid var(--accent); }
.field { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.field-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px 10px; align-items: end; }

/* ===================================================== envelope editor ==== */
.env-block { display: flex; flex-direction: column; gap: 6px; border-top: 1px solid #262a30; padding-top: 8px; }
.env-tabs { display: flex; align-items: center; gap: 2px; }
.env-tab {
  background: transparent; border: 1px solid transparent; border-radius: 5px; padding: 3px 9px;
  font-size: 9.5px; font-weight: 700; letter-spacing: 0.14em; color: var(--muted); cursor: pointer;
  display: flex; align-items: center; gap: 5px;
}
.env-tab .led { width: 5px; height: 5px; }
.env-tab:hover { color: var(--text); }
.env-tab.active { color: var(--accent); border-color: var(--accent-dim); background: var(--accent-bg); }
.env-graph { position: relative; height: 92px; background: var(--screen); border: 1px solid #000; border-radius: 6px; box-shadow: inset 0 2px 8px rgba(0, 0, 0, 0.9); }
.env-graph svg { position: absolute; inset: 0; width: 100%; height: 100%; overflow: visible; }
.eg-grid { stroke: #191c20; stroke-width: 1; vector-effect: non-scaling-stroke; }
.eg-zero { stroke: #2b3036; stroke-width: 1; stroke-dasharray: 3 3; vector-effect: non-scaling-stroke; }
.eg-fill { fill: rgba(217, 173, 82, 0.08); stroke: none; }
.eg-line { fill: none; stroke: var(--accent); stroke-width: 1.7; vector-effect: non-scaling-stroke; filter: drop-shadow(0 0 3px var(--accent-glow)); stroke-linejoin: round; }
.eg-handle { fill: var(--screen); stroke: var(--accent-hi); stroke-width: 1.6; cursor: grab; vector-effect: non-scaling-stroke; }
.eg-handle:hover, .eg-handle.drag { fill: var(--accent); }
.eg-handle.drag { cursor: grabbing; }
.eg-label { fill: var(--faint); font: 600 8.5px var(--sans); letter-spacing: 0.1em; pointer-events: none; }
.eg-text { position: absolute; right: 6px; top: 4px; font-family: var(--mono); font-size: 9.5px; color: #cdd0d4; background: rgba(8, 9, 10, 0.75); padding: 1px 4px; border-radius: 3px; pointer-events: none; }
.env-knobs { display: grid; grid-template-columns: repeat(6, minmax(0, 1fr)); justify-items: center; row-gap: 2px; }

/* --------------------------------------------------------------- keybed --- */
.keybed {
  display: flex; gap: 12px; background: #000; border: 1px solid #1c1e22; border-radius: 12px;
  padding: 12px; box-shadow: inset 0 4px 14px rgba(0, 0, 0, 0.9);
}
.octave-ctl { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px; width: 92px; flex: none; }
.oct-buttons { display: flex; gap: 6px; }
.oct-buttons button {
  width: 34px; height: 30px; background: #1d2024; border: 1px solid #33373e; border-radius: 6px;
  font-size: 18px; line-height: 1; cursor: pointer;
}
.oct-buttons button:hover { border-color: var(--accent-dim); }
.oct-buttons button:active { transform: translateY(1px); }
.oct-readout { font-family: var(--mono); font-size: 12px; color: var(--accent); }
.kbd-hint { font-size: 10px; color: var(--faint); text-align: center; line-height: 1.4; }
.range-toggle { font-size: 9px; padding: 3px 6px; }

.piano { flex: 1; min-width: 0; }
.piano-svg { display: block; width: 100%; height: auto; touch-action: none; cursor: pointer; }
.felt { fill: #4a3a17; }
.wkey { fill: #ecebe6; stroke: #6d6f73; stroke-width: 1; transition: fill 40ms; }
.wkey:hover { fill: #ffffff; }
.bkey { fill: #15171a; stroke: #000; stroke-width: 1; transition: fill 40ms; }
.bkey:hover { fill: #2a2d31; }
.wkey.out { fill: #8d8c88; }
.bkey.out { fill: #3a3c40; }
.wkey.ks { fill: #6f9fbd; }
.bkey.ks { fill: #2d5670; }
.wkey.down, .bkey.down { fill: var(--accent); stroke: #8a6a28; }
.klabel { fill: #5b6068; font: 600 10px var(--sans); text-anchor: middle; pointer-events: none; }
.range-mark { fill: var(--accent); opacity: 0.85; }
.ks-mark { fill: #6f9fbd; }

/* wheels */
.wheel-ctl { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 5px; width: 40px; flex: none; }
.wheel-svg { width: 26px; height: 110px; cursor: ns-resize; touch-action: none; outline: none; }
.wheel-svg:focus-visible .wh-slot { stroke: var(--accent); }
.wh-slot { fill: #0b0c0e; stroke: #2c2f35; }
.wh-ridges line { stroke: #1b1d21; stroke-width: 1.5; }
.wh-fill { fill: var(--accent-dim); opacity: 0.6; }
.wh-thumb { fill: #d9d7d0; stroke: #7d7d7d; }
.wheel-ctl:hover .wh-thumb { fill: #fff; }
.wheel-value { font-family: var(--mono); font-size: 10px; color: var(--accent); }

/* ------------------------------------------------------------ statusbar --- */
.statusbar { display: flex; justify-content: space-between; align-items: center; gap: 12px; font-family: var(--mono); font-size: 11px; color: var(--muted); padding: 0 4px; }
.monitor { flex: 1; min-width: 0; white-space: pre; overflow: hidden; text-overflow: ellipsis; }
.audio-status { display: flex; align-items: center; gap: 6px; flex: none; }

/* ================================================================ modal === */
.modal { position: fixed; inset: 0; z-index: 20; display: flex; align-items: center; justify-content: center; background: rgba(5, 6, 8, 0.7); }
.modal.hidden { display: none; }
.modal-card {
  width: min(420px, calc(100vw - 32px));
  background: linear-gradient(180deg, #23272c, #181a1e);
  border: 1px solid var(--panel-edge); border-radius: 12px; padding: 18px;
  display: flex; flex-direction: column; gap: 12px; box-shadow: 0 20px 60px rgba(0, 0, 0, 0.7);
}
.modal-title { font-size: 12px; font-weight: 700; letter-spacing: 0.16em; text-transform: uppercase; }
.modal-body { font-size: 13px; color: var(--muted); line-height: 1.5; }
.modal-body b { color: var(--text); }
#modal-input {
  background: var(--screen); color: var(--accent); border: 1px solid var(--panel-edge); border-radius: 6px;
  padding: 9px 10px; font: 14px var(--mono); outline: none; user-select: text;
}
#modal-input:focus { border-color: var(--accent-dim); }
.modal-actions { display: flex; justify-content: flex-end; gap: 8px; }

/* ============================================================ header ===== */
.bpm-ctl input {
  width: 52px; background: var(--screen); color: var(--accent);
  border: 1px solid var(--panel-edge); border-radius: 4px; padding: 3px 4px;
  font: 600 11px var(--mono); text-align: right;
}
.bpm-ctl input[readonly] { color: var(--muted); border-color: transparent; background: transparent; cursor: default; }
.web-only { display: none !important; }
body.web .web-only { display: flex !important; }

/* ----------------------------------------------------------- responsive --- */
@media (max-width: 900px) {
  .play-row-1, .play-row-2, .osc-row { grid-template-columns: minmax(0, 1fr); }
}
@media (max-width: 560px) {
  body { padding: 12px 8px; }
  .synth { padding: 12px; }
  .patch-display { min-width: 0; flex-basis: 100%; }
  .keybed { flex-direction: column; }
  .octave-ctl { flex-direction: row; width: auto; }
  .kbd-hint { display: none; }
}

/* ===================================================== plugin overrides ===
   The panel is laid out at a fixed design width and scaled (app.js fit())
   to whatever size the plugin window is. */
body.plugin { display: block; padding: 0; height: 100vh; overflow: hidden; background: var(--bg); }
body.plugin .synth {
  position: absolute; top: 12px; left: 50%; width: 1180px; max-width: none;
  transform-origin: top center; transform: translateX(-50%);
}
body.plugin .play-row-1 { grid-template-columns: minmax(0, 0.8fr) minmax(0, 1.6fr); }

body.plugin .osc-row { grid-template-columns: repeat(3, minmax(0, 1fr)); }
body.plugin .keybed { flex-direction: row; }
body.plugin .octave-ctl { flex-direction: column; width: 92px; }
body.plugin .kbd-hint { display: block; }

</style>

  <script>
// ============================================================================
//  Parameter definitions. Must match vst/Source/Params.h exactly (IDs, ranges,
//  defaults, skew, choice lists, ORDER); tests/check-params.ps1 compares them.
//  New parameters are only appended. The web build is generated from this file.
// ============================================================================
'use strict';

const INSTRUMENTS = ['Trumpet', 'Flugelhorn', 'Trombone', 'French Horn', 'Tuba',
                     'Soprano Sax', 'Alto Sax', 'Tenor Sax', 'Baritone Sax', 'Synth'];
const ENGINE_MODES = ['Modeled', 'Analog', 'Physical'];
const PM_TYPES = ['Auto', 'Lips', 'Reed'];
const VOICE_MODES = ['Poly', 'Mono', 'Legato'];
const GLIDE_MODES = ['Always', 'Legato'];
const OVERSAMPLE = ['1x', '2x', '4x'];
const FLT_TYPES = ['LP12', 'LP24', 'BP'];
const BRS_TYPES = ['Brass', 'Reed', 'Edge'];
const TONGUES = ['Soft', 'Normal', 'Hard'];
const MUTE_TYPES = ['Open', 'Straight', 'Cup', 'Harmon', 'Plunger'];
const MUTE_SRCS = ['Knob', 'Mod Wheel', 'Breath', 'Expression', 'Aftertouch', 'CC'];
const LFO_WAVES = ['Sine', 'Triangle', 'Square', 'Saw Up', 'Saw Down', 'S&H'];
const LFO_DIVS = ['1/1', '1/2D', '1/2', '1/2T', '1/4D', '1/4', '1/4T', '1/8D', '1/8', '1/8T',
                  '1/16D', '1/16', '1/16T', '1/32', '1/32T'];
const LFO_MODES = ['Global', 'Voice'];
const LFO_TRIGS = ['Free', 'Note'];
const MOD_SOURCES = ['None', 'LFO 1', 'LFO 2',
  'Osc 1 Amp Env', 'Osc 2 Amp Env', 'Osc 3 Amp Env',
  'Osc 1 Pitch Env', 'Osc 2 Pitch Env', 'Osc 3 Pitch Env',
  'Osc 1 Timbre Env', 'Osc 2 Timbre Env', 'Osc 3 Timbre Env',
  'Harm Low Env', 'Harm Mid Env', 'Harm High Env', 'Filter Env',
  'Velocity', 'Dynamics', 'Breath', 'Expression', 'Aftertouch',
  'MPE Pressure', 'MPE Slide', 'MPE Bend', 'Mod Wheel', 'Pitch Bend', 'Key', 'Random', 'Vibrato'];
const MOD_DESTS = ['None', 'Pitch (All)', 'Osc 1 Pitch', 'Osc 2 Pitch', 'Osc 3 Pitch',
  'Osc 1 Level', 'Osc 2 Level', 'Osc 3 Level',
  'Osc 1 Shape', 'Osc 2 Shape', 'Osc 3 Shape',
  'Osc 1 PW', 'Osc 2 PW', 'Osc 3 PW',
  'Osc 1 Bright', 'Osc 2 Bright', 'Osc 3 Bright',
  'Harm Level', 'Harm Tilt', 'Filter Cutoff', 'Filter Reso',
  'Dynamics', 'Brightness', 'Brassiness', 'Breath Noise', 'Lip Buzz',
  'Vibrato Depth', 'Vibrato Rate', 'Growl', 'Flutter', 'Amplitude', 'Pan',
  'LFO 1 Rate', 'LFO 2 Rate', 'Plunger', 'Body Shift', 'FX Drive', 'Chorus Mix', 'Reverb Mix'];
const FX_DRV_TYPES = ['Tube', 'Tape'];
const RV_TYPES = ['Plate', 'Hall'];
const SHAPE_NAMES = ['Sine', 'Tri', 'Saw', 'Pulse'];
const NUM_OSC = 3;
const NUM_MOD_SLOTS = 12;
const MAX_POLY = 64;

const NOTE_NAMES = ['C', 'C#', 'D', 'D#', 'E', 'F', 'F#', 'G', 'G#', 'A', 'A#', 'B'];
function midiNoteName(n) { return NOTE_NAMES[((n % 12) + 12) % 12] + (Math.floor(n / 12) - 1); }

// Realistic written-pitch ranges (MIDI notes, concert pitch) per instrument; used to
// shade the keyboard. Same order as INSTRUMENTS. Synth = no limits.
const INSTRUMENT_RANGES = [
  [52, 84],  // Trumpet       E3 - C6
  [52, 79],  // Flugelhorn    E3 - G5
  [40, 72],  // Trombone      E2 - C5
  [34, 77],  // French Horn   B1 - F5
  [26, 58],  // Tuba          D1 - A#3
  [56, 87],  // Soprano Sax   G#3 - D#6
  [49, 80],  // Alto Sax      C#3 - G#5
  [44, 75],  // Tenor Sax     G#2 - D#5
  [36, 68],  // Baritone Sax  C2 - G#4
  [0, 127],  // Synth
];

// ---- builders (same shapes as Params.h) ----------------------------------------
const P = (id, name, group, min, max, def, unit, extra) =>
  Object.assign({ id, name, group, type: 'float', min, max, def, unit: unit || '' }, extra || {});
const L = (id, name, group, min, max, def, unit) => P(id, name, group, min, max, def, unit, { skew: 'log' });
const I = (id, name, group, min, max, def, unit) => P(id, name, group, min, max, def, unit || 'count', { type: 'int', step: 1 });
const B = (id, name, group, def) => ({ id, name, group, type: 'bool', min: 0, max: 1, step: 1, def: def ? 1 : 0, unit: '' });
const C = (id, name, group, choices, def) =>
  ({ id, name, group, type: 'choice', min: 0, max: choices.length - 1, step: 1, def, choices, unit: '' });
const BIP = { bipolar: true };

function oscParams(n) {

function defaultParamValues() {
  return Object.fromEntries(PARAM_DEFS.map(d => [d.id, d.def]));
}

// value <-> 0..1 normalized (same mapping the VST host sees)
function paramToNorm(d, v) {
  if (d.skew === 'log') return clamp(Math.log(v / d.min) / Math.log(d.max / d.min), 0, 1);
  return clamp((v - d.min) / (d.max - d.min), 0, 1);
}

function paramFromNorm(d, n) {
  n = clamp(n, 0, 1);
  let v = d.skew === 'log' ? d.min * Math.pow(d.max / d.min, n) : d.min + n * (d.max - d.min);
  if (d.step) v = Math.round(v / d.step) * d.step;
  return clamp(v, d.min, d.max);
}

function formatParam(d, v) {
  if (d.type === 'choice') return d.choices[clamp(Math.round(v), 0, d.choices.length - 1)];
  if (d.type === 'bool') return v >= 0.5 ? 'On' : 'Off';
  const sgn = (x) => (x > 0 ? '+' : '');
  switch (d.unit) {
    case 's':     return v < 1 ? `${Math.round(v * 1000)} ms` : `${v.toFixed(2)} s`;
    case 'Hz':    return v >= 1000 ? `${(v / 1000).toFixed(v >= 10000 ? 1 : 2)} kHz` : `${Math.round(v)} Hz`;
    case 'lfohz': return `${v.toFixed(v < 1 ? 3 : v < 10 ? 2 : 1)} Hz`;
    case 'st':    return Math.abs(v - Math.round(v)) > 0.05 ? `${sgn(v)}${v.toFixed(1)} st` : `${sgn(v)}${Math.round(v)} st`;
    case 'ct':    return `${sgn(v)}${Math.round(v)} ct`;
    case '%':     return `${Math.round(v * 100)}%`;
    case 'bip':   return `${v > 0.004 ? '+' : ''}${Math.round(v * 100)}%`;
    case 'dB':    return `${v > 0.05 ? '+' : ''}${v.toFixed(1)} dB`;
    case 'deg':   return `${Math.round(v)}°`;
    case 'oct':   return `${v > 0.005 ? '+' : ''}${v.toFixed(1)} oct`;
    case 'harm':  return `×${v.toFixed(v < 10 ? 1 : 0)}`;
    case 'ms':    return `${Math.round(v)} ms`;
    case 'dboct': return `${v > 0.05 ? '+' : ''}${v.toFixed(1)} dB/oct`;
    case 'count': return String(Math.round(v));
    case 'note':  return midiNoteName(Math.round(v));
    case 'shape': {
      const i = clamp(Math.floor(v), 0, 3), f = v - i;
      if (f < 0.01 || i === 3) return SHAPE_NAMES[i];
      return `${SHAPE_NAMES[i]}›${SHAPE_NAMES[i + 1]} ${Math.round(f * 100)}%`;
    }
    default:      return v.toFixed(2);
  }
}

      const t = Math.log(hz / H[i - 1]) / Math.log(H[i] / H[i - 1]);
      return D[i - 1] + (D[i] - D[i - 1]) * t;
    }
  }
  return D[3];
}

// Harmonic amplitudes (linear, normalised to unit power) for a note at dynamics d (0..1)
function harmonicAmplitudes(values, f0, d, sr) {
  const m = INSTRUMENT_MODELS[clamp(Math.round(values.instrument), 0, 9)];
  const bc = Math.abs(values.dynBrCurve) < 1e-3 ? d : Math.pow(d, Math.pow(2, 2 * values.dynBrCurve));
  const slope = 0.5 * (m[0] + m[1]) + (1 - 2 * bc) * values.addDynSpread * 0.5 * (m[0] - m[1]);
  const out = [];
  let power = 0;
  for (let k = 0; k < Math.round(values.addPartials); k++) {
    const f = f0 * (k + 1);
    if (f >= 0.45 * sr) break;
    let a = Math.exp((spectralEnvelopeDb(m, f) + slope * k + values.addTilt * Math.log2(k + 1)) * 0.11512925464970229);
    const even = (k + 1) % 2 === 0;
    if (values.addOddEven > 0 && even) a *= 1 - values.addOddEven;
    else if (values.addOddEven < 0 && !even && k > 0) a *= 1 + values.addOddEven;
    out.push(a);
    power += a * a;
  }
  const norm = power > 0 ? 1 / Math.sqrt(power) : 0;
  return out.map(a => a * norm);
}

// RBJ biquad (same as designBiquad in Filters.h) and its magnitude at f
function biquadCoefs(type, fc, q, db, sr) {
  fc = clamp(fc, 10, sr * 0.45); q = Math.max(q, 0.05);
  const A = Math.pow(10, db / 40), w0 = 2 * Math.PI * fc / sr, cw = Math.cos(w0), sw = Math.sin(w0);
  const alpha = sw / (2 * q), sa = 2 * Math.sqrt(A) * alpha;
  let b0 = 1, b1 = 0, b2 = 0, a0 = 1, a1 = 0, a2 = 0;
  switch (type) {
    case BQ.lowShelf:
      b0 = A * ((A + 1) - (A - 1) * cw + sa); b1 = 2 * A * ((A - 1) - (A + 1) * cw); b2 = A * ((A + 1) - (A - 1) * cw - sa);
      a0 = (A + 1) + (A - 1) * cw + sa; a1 = -2 * ((A - 1) + (A + 1) * cw); a2 = (A + 1) + (A - 1) * cw - sa; break;
    case BQ.highShelf:
      b0 = A * ((A + 1) + (A - 1) * cw + sa); b1 = -2 * A * ((A - 1) + (A + 1) * cw); b2 = A * ((A + 1) + (A - 1) * cw - sa);
      a0 = (A + 1) - (A - 1) * cw + sa; a1 = 2 * ((A - 1) - (A + 1) * cw); a2 = (A + 1) - (A - 1) * cw - sa; break;
    case BQ.lowPass:  b0 = (1 - cw) / 2; b1 = 1 - cw; b2 = (1 - cw) / 2; a0 = 1 + alpha; a1 = -2 * cw; a2 = 1 - alpha; break;
    case BQ.highPass: b0 = (1 + cw) / 2; b1 = -(1 + cw); b2 = (1 + cw) / 2; a0 = 1 + alpha; a1 = -2 * cw; a2 = 1 - alpha; break;
    case BQ.bandPass: b0 = alpha; b1 = 0; b2 = -alpha; a0 = 1 + alpha; a1 = -2 * cw; a2 = 1 - alpha; break;
    default: b0 = 1 + alpha * A; b1 = -2 * cw; b2 = 1 - alpha * A; a0 = 1 + alpha / A; a1 = -2 * cw; a2 = 1 - alpha / A;
  }
  return [b0 / a0, b1 / a0, b2 / a0, a1 / a0, a2 / a0];
}

function biquadMagDb(c, f, sr) {
  const w = 2 * Math.PI * f / sr;
  const cr = Math.cos(w), ci = -Math.sin(w), c2r = Math.cos(2 * w), c2i = -Math.sin(2 * w);
  const nr = c[0] + c[1] * cr + c[2] * c2r, ni = c[1] * ci + c[2] * c2i;
  const dr = 1 + c[3] * cr + c[4] * c2r, di = c[3] * ci + c[4] * c2i;
  return 10 * Math.log10((nr * nr + ni * ni) / Math.max(dr * dr + di * di, 1e-30));
}

// Body response (dB) at f with the current body settings, blended by bodyMix
function bodyResponseDb(values, f, sr) {
  const m = INSTRUMENT_MODELS[clamp(Math.round(values.instrument), 0, 9)];
  const shift = Math.pow(2, values.bodyShift / 12);
  let db = 0;
  for (const b of m[4]) db += biquadMagDb(biquadCoefs(b[0], b[1] * shift, b[3], b[2] * (0.5 + values.bodyReso), sr), f, sr);
  const lin = Math.pow(10, db / 20), mix = values.bodyMix;
  return 20 * Math.log10(Math.max(1e-4, Math.abs(1 + mix * (lin - 1))));   // magnitude-only approximation of the blend
}

// Mute response (dB) at f, plunger position p (0 closed .. 1 open)
function muteResponseDb(values, f, sr, p) {
  const type = Math.round(values.muteType);
  if (type === 0) return 0;
  const mm = MUTE_MODELS[type];
  let db = mm[1];
  for (const b of mm[0]) db += biquadMagDb(biquadCoefs(b[0], b[1], b[3], b[2], sr), f, sr);

  }

  return 20 * Math.log10(Math.max(1e-4, Math.abs(1 + mix * (lin - 1))));
}

// Brassiness transfer curve (same shapes as shapeFn in Oversampler.h)
function shapeFn(type, x) {
  if (type === 1) { const t = x / (1 + Math.abs(x)); return t + 0.12 * t * t; }
  if (type === 2) { const c = clamp(x, -1, 1); return 1.5 * c - 0.5 * c * c * c; }
  const c = clamp(x, -3, 3), x2 = c * c, t = c * (27 + x2) / (27 + 9 * x2);
  return t + 0.18 * t * t;
}

<script>
// ============================================================================
//  Factory presets for the web build: resolves vst/presets/factory_presets.json
//  exactly like PresetManager::loadFactory (C++):
//    preset values = parameter defaults <- template chain (base first) <- own params
//  Values are clamped to the parameter range (not rounded), like applyParamObject.
//  Also the preset-file migration steps (twin of PresetManager::migrate).
//  Needs params.js (PARAM_BY_ID, clamp).
// ============================================================================
'use strict';

const BK_PRESET_VERSION = 1;
const BK_PRESET_FORMAT = 'Brass Knuckles Preset';
const BK_PRESET_EXT = '.bkpreset';

// Copies every known { paramId: number } into out (master excluded). Returns how many were found.
function bkApplyParamObject(obj, out) {
  let found = 0;
  if (!obj || typeof obj !== 'object') return 0;
  for (const id of Object.keys(obj)) {
    const d = PARAM_BY_ID[id];
    const raw = obj[id];
    if (!d || id === 'master' || !(typeof raw === 'number' || typeof raw === 'boolean')) continue;
    out[id] = clamp(Number(raw), d.min, d.max);
    ++found;
  }
  return found;
}

// [{ name, category, values }] where values holds only what the template chain + preset set.
function bkFactoryPresets(json) {
  const templates = (json && json.templates) || {};
  const applyTemplate = (name, out, depth) => {
    if (!name || depth > 8) return;
    const t = templates[name];
    if (!t || typeof t !== 'object') { console.warn(`unknown preset template "${name}"`); return; }
    applyTemplate(t.base, out, depth + 1);
    bkApplyParamObject(t.params, out);
  };
  const list = [];
  for (const cat of (json && json.categories) || []) {
    for (const p of cat.presets || []) {
      const values = {};
      applyTemplate(p.base, values, 0);
      bkApplyParamObject(p.params, values);
      list.push({ name: String(p.name), category: String(cat.name), values });
    }
  }
  if (!list.length) list.push({ name: 'Init', category: 'Factory', values: {} });
  return list;
}

// Brings a preset object written by an older version up to BK_PRESET_VERSION (in place).
// Same steps as PresetManager::migrate. Plain parameter additions need no step.
function bkMigratePreset(json) {
  if (!json || typeof json !== 'object') return json;
  let version = Number.isFinite(Number(json.version)) ? Math.trunc(Number(json.version)) : 1;
  version = Math.max(version, 1);
  // while (version < BK_PRESET_VERSION) { switch (version) { case 1: /* 1 -> 2 */ break; } ++version; }
  if (version < BK_PRESET_VERSION) version = BK_PRESET_VERSION;
  json.version = version;
  return json;
}

<script>
// ============================================================================
//  Brass Knuckles DSP engine: JavaScript twin of vst/Source/SynthEngine.h and
//  vst/Source/dsp/*.h. Kept line-for-line equivalent (same control rate, same
//  RNG, same maths, same order of operations) and checked against the C++
//  build by vst/tests/run-parity.ps1.
//
//  This whole function is stringified and loaded as an AudioWorklet module
//  (or run on the main thread as a ScriptProcessor fallback), so it must not
//  reference anything outside itself.
//
//  Performance notes: nothing allocates on the audio path. Per-chunk scratch
//  arrays live on the engine; envelope times are written into reused objects.
// ============================================================================
function synthWorkletModule() {
  'use strict';

  // ======================================================== dsp/Common.h ===
  const kPi = 3.141592653589793, kTwoPi = 6.283185307179586, kSqrt2 = 1.4142135623730951, kLn2 = 0.6931471805599453;
  const kSilence = 1e-4;

  const clampd = (v, lo, hi) => (v < lo ? lo : (v > hi ? hi : v));
  const clampi = (v, lo, hi) => (v < lo ? lo : (v > hi ? hi : v));

    constructor() { this.s = 0x2545F491; }
    seed(v) { this.s = v >>> 0; }
    next() { this.s = (Math.imul(this.s, 1664525) + 1013904223) >>> 0; return this.s; }
    uni() { return (this.next() >>> 8) * (1 / 16777216); }

  }

  function curveShape(p, c) {
    if (c > -1e-3 && c < 1e-3) return p;
    const k = 5 * c;
    return (1 - Math.exp(-k * p)) / (1 - Math.exp(-k));
  }

  function responseCurve(x, c) {
    x = clampd(x, 0, 1);
    if (c > -1e-3 && c < 1e-3) return x;
    return Math.pow(x, Math.pow(2, 2 * c));

  function polyBlep(t, dt) {
    if (t < dt) { t /= dt; return t + t - t * t - 1; }
    if (t > 1 - dt) { t = (t - 1) / dt; return t * t + t + t + 1; }
    return 0;
  }

  class SVF {
    constructor() { this.ic1 = 0; this.ic2 = 0; this.bp = 0; }
    reset() { this.ic1 = this.ic2 = this.bp = 0; }
    static gFor(fc, sr) {
      fc = Math.min(Math.max(fc, 20), sr * 0.45);
      return Math.tan(kPi * fc / sr);
    }
    static kFor(reso) { return 2 - 1.9 * reso; }
    process(x, g, k) {
      const a1 = 1 / (1 + g * (g + k));
      const a2 = g * a1;
      const a3 = g * a2;
      const v3 = x - this.ic2;
      const v1 = a1 * this.ic1 + a2 * v3;
      const v2 = this.ic2 + a2 * this.ic1 + a3 * v3;
      this.ic1 = 2 * v1 - this.ic1;
      this.ic2 = 2 * v2 - this.ic2;
      this.bp = v1;
      return v2;
    }
  }

  // ====================================================== dsp/Envelope.h ===
  class EnvTimes {
    constructor() { this.dly = 0; this.atk = 0.01; this.hld = 0; this.dec = 0.3; this.sus = 1; this.rel = 0.2; this.atkC = 0; this.decC = 0; this.relC = 0; }
  }
  const kEnvMinStage = 0.0011;
  const ST_IDLE = 0, ST_DELAY = 1, ST_ATTACK = 2, ST_HOLD = 3, ST_DECAY = 4, ST_SUSTAIN = 5, ST_RELEASE = 6;

  class Envelope {
    constructor() { this.stage = ST_IDLE; this.pos = 0; this.level = 0; this.from = 0; this.dt = 0; }
    active() { return this.stage !== ST_IDLE; }
    gateOn() { this.stage = ST_DELAY; this.pos = 0; this.from = this.level; }
    gateOff() {

      this.stage = ST_RELEASE; this.pos = 0; this.from = this.level;
    }
    kill() { this.stage = ST_IDLE; this.level = 0; this.pos = 0; this.from = 0; }

    advance(e, dt) {

          case ST_DELAY:
            if (!this.step(e.dly > kEnvMinStage ? e.dly : 0)) { this.level = this.from; return this.level; }

        a1 = -2 * ((A - 1) + (A + 1) * cw);

        break;
      case bqHighShelf:
        b0 = A * ((A + 1) + (A - 1) * cw + sa);
        b1 = -2 * A * ((A - 1) + (A + 1) * cw);
        b2 = A * ((A + 1) + (A - 1) * cw - sa);
        a0 = (A + 1) - (A - 1) * cw + sa;
        a1 = 2 * ((A - 1) - (A + 1) * cw);
        a2 = (A + 1) - (A - 1) * cw - sa;
        break;
      case bqLowPass:

        a0 = 1 + alpha; a1 = -2 * cw; a2 = 1 - alpha;
        break;

        a0 = 1 + alpha; a1 = -2 * cw; a2 = 1 - alpha;
        break;

        a0 = 1 + alpha / A; a1 = -2 * cw; a2 = 1 - alpha / A;
