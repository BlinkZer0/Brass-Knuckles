<script>
// ============================================================================
//  Web host: stands in for the plugin's C++ side when the UI runs in a
//  browser. It provides window.__JUCE__.backend with exactly the events the
//  JUCE editor uses (see PluginEditor.cpp), so vst/ui runs unchanged:
//    audio   Web Audio: AudioWorklet (or ScriptProcessor fallback on file://)
//            running dsp-worklet.js, the JS twin of SynthEngine.h
//    MIDI    Web MIDI (all inputs or one); every channel message goes to the
//            engine with the plugin's routing (notes, CCs incl. breath, bend,
//            aftertouch, poly pressure, MPE)
//    tempo   user-set BPM (the plugin uses the host's)
//    presets factory (FACTORY_JSON via factory.js), this browser (localStorage),
//            or a linked folder on disk (File System Access API), same
//            .bkpreset format as the plugin, rescanned every 2 s
//  Needs params.js, factory.js, dsp-worklet.js and FACTORY_JSON loaded first.
// ============================================================================
(function () {
  'use strict';

  // ---------------------------------------------------------- the bridge ---
  const listeners = {};
  const handlers = {};
  const toUi = (ev, data) => queueMicrotask(() => (listeners[ev] || []).forEach(f => f(data)));
  window.__JUCE__ = {
    backend: {
      addEventListener(ev, fn) { (listeners[ev] = listeners[ev] || []).push(fn); },
      // handled synchronously so file pickers / permission prompts keep the click's user activation
      emitEvent(ev, data) { const h = handlers[ev]; if (h) h(data || {}); },
    },
  };
  const message = (text) => toUi('message', { text });
  const store = {
    get(k) { try { return localStorage.getItem(k); } catch (e) { return null; } },
    set(k, v) { try { localStorage.setItem(k, v); return true; } catch (e) { return false; } },
  };

  // ------------------------------------------------------ factory presets ---
  const FACTORY = bkFactoryPresets(FACTORY_JSON).map((p, i) =>
    ({ id: `factory:${i}`, name: p.name, category: p.category, factory: true, values: p.values }));

  // ---------------------------------------------------------------- state ---
  const values = defaultParamValues();
  let current = { id: '', name: '', category: '' };
  let tempo = clamp(Number(store.get('bk.tempo')) || 120, 20, 300);

  // Every preset parameter: the preset's value, else the default (like PluginProcessor::applyPreset).
  // Master is never part of a preset. Stepped parameters snap like the plugin's int / choice params.
  function presetValues(pv) {
    const out = {};
    for (const d of PARAM_DEFS) {
      if (d.noPreset) continue;
      let v = Number(pv[d.id]);
      if (pv[d.id] === undefined || pv[d.id] === null || isNaN(v)) v = d.def;
      v = clamp(v, d.min, d.max);
      if (d.step) v = Math.round(v / d.step) * d.step;
      out[d.id] = v;
    }
    return out;
  }
  function applyPreset(pv, info) {
    const all = presetValues(pv);
    Object.assign(values, all);
    audio.post({ type: 'params', values: all });
    current = info;
    toUi('params', Object.assign({}, values));
    toUi('preset', current);
  }

  // a fresh instance starts on the first factory preset, like the plugin
  Object.assign(values, presetValues(FACTORY[0].values));
  current = { id: FACTORY[0].id, name: FACTORY[0].name, category: FACTORY[0].category };

  // ---------------------------------------------------------------- audio ---
  const audio = {
    ctx: null, node: null, port: null, mode: '', error: '',
    post(m) { if (this.port) this.port.postMessage(m); },
    get running() { return !!this.ctx && this.ctx.state === 'running'; },

    async start() {
      const ctx = new (window.AudioContext || window.webkitAudioContext)({ latencyHint: 'interactive' });
      this.ctx = ctx;
      ctx.onstatechange = sendConfig;
      const src = `(${synthWorkletModule.toString()})();`;
      let built = null;
      if (ctx.audioWorklet && location.protocol !== 'file:') {
        try {
          const url = URL.createObjectURL(new Blob([src], { type: 'application/javascript' }));
          try { await ctx.audioWorklet.addModule(url); } finally { URL.revokeObjectURL(url); }
          const node = new AudioWorkletNode(ctx, 'brass-knuckles', {
            numberOfInputs: 0, numberOfOutputs: 1, outputChannelCount: [2],
            processorOptions: { params: values },
          });
          node.port.onmessage = (e) => onDspMessage(e.data);
          // an exception inside the audio thread silences the node: say so instead of failing quietly
          node.onprocessorerror = (e) => {
            audio.error = 'the audio engine stopped (processor error); reload the page';
            console.error('AudioWorklet processor error', e);
            message(`Audio engine error: ${(e && e.message) || 'processor error'}. Reload the page.`);
            sendConfig();
          };
          built = { node, port: node.port, mode: 'AudioWorklet' };
        } catch (e) { console.warn('AudioWorklet unavailable, using ScriptProcessor', e); }
      }
      if (!built) built = this.scriptProcessor(ctx, src);
      this.node = built.node; this.port = built.port; this.mode = built.mode;
      this.node.connect(ctx.destination);
      this.post({ type: 'tempo', bpm: tempo });
      this.post({ type: 'params', values: Object.assign({}, values) }); // anything changed while starting
      sendConfig();
    },

    // Chrome/Edge block worklet modules on file://: run the same DSP on the main thread
    scriptProcessor(ctx, src) {
      class AudioWorkletProcessorShim { constructor() { this.port = { postMessage: onDspMessage, onmessage: null }; } }
      let Processor = null;
      new Function('AudioWorkletProcessor', 'registerProcessor', 'sampleRate', src)(
        AudioWorkletProcessorShim, (name, cls) => { Processor = cls; }, ctx.sampleRate);
      const proc = new Processor({ processorOptions: { params: values } });
      const L128 = new Float32Array(128), R128 = new Float32Array(128);
      const node = ctx.createScriptProcessor(1024, 0, 2);
      node.onaudioprocess = (e) => {
        const L = e.outputBuffer.getChannelData(0), R = e.outputBuffer.getChannelData(1);
        for (let off = 0; off < L.length; off += 128) {
          proc.process([], [[L128, R128]]);
          L.set(L128, off); R.set(R128, off);
        }
      };
      return { node, port: { postMessage: (m) => proc.port.onmessage({ data: m }) }, mode: 'ScriptProcessor' };
    },
  };

  function onDspMessage(m) { if (m.type === 'stats') toUi('stats', m); }

  function sendConfig() {
    const c = audio.ctx;
    let text;
    if (audio.error) text = `Audio error: ${audio.error}`;
    else if (!audio.running) text = 'Click anywhere to enable audio';
    else text = `Web · ${audio.mode} · ${(c.sampleRate / 1000).toFixed(1)} kHz · ~${(((c.baseLatency || 0) + (c.outputLatency || 0)) * 1000).toFixed(1)} ms`;
    toUi('config', { wrapper: 'Web', sampleRate: c ? c.sampleRate : 0, blockSize: 128, voices: MAX_POLY, audio: text, running: audio.running });
  }

  const started = audio.start().catch((e) => { audio.error = e.message || String(e); console.error(e); sendConfig(); });
  function unlockAudio() {
    if (audio.running || audio.error) return;
    started.then(() => audio.ctx && audio.ctx.resume()).then(sendConfig).catch(() => {});
  }
  document.addEventListener('pointerdown', unlockAudio, true);
  document.addEventListener('keydown', unlockAudio, true);

  // ---------------------------------------------------------------- notes ---
  // Sounding notes, for the on-screen keyboard (the plugin tracks them per channel the same way).
  const sounding = new Set();
  function noteShown(note, on) {
    if (on) { sounding.add(note); toUi('notes', { on: [note], off: [] }); }
    else if (sounding.delete(note)) toUi('notes', { on: [], off: [note] });
  }
  function allShownOff() {
    const off = [...sounding];
    sounding.clear();
    if (off.length) toUi('notes', { on: [], off });
  }
  function sendMidi(data) {
    if (!audio.running && (data[0] & 0xf0) === 0x90 && data[2] > 0) message('Audio is off: click anywhere on the page once to enable it');
    audio.post({ type: 'midi', data });
  }

  // ----------------------------------------------------------------- MIDI ---
  const midi = { access: null, selected: store.get('bk.midiInput') || 'all' };
  function midiInputs() {
    return midi.access ? Array.from(midi.access.inputs.values()).map(i => ({ id: i.id, name: i.name, state: i.state })) : [];
  }
  function bindMidi() {
    if (!midi.access) return;
    for (const input of midi.access.inputs.values()) {
      const on = midi.selected === 'all' || midi.selected === input.id;
      input.onmidimessage = on ? (e) => onMidi(e.data) : null;
    }
  }
  function onMidi(d) {
    const st = d[0];
    if (st >= 0xf0 || st < 0x80) return;   // no SysEx / clock / running status
    const cmd = st & 0xf0;
    sendMidi(Array.from(d.slice(0, cmd === 0xc0 || cmd === 0xd0 ? 2 : 3)));
    if (cmd === 0x90 && d[2] > 0) noteShown(d[1], true);
    else if (cmd === 0x80 || cmd === 0x90) noteShown(d[1], false);
    else if (cmd === 0xb0 && (d[1] === 120 || d[1] === 123)) allShownOff();
  }
  if (typeof navigator.requestMIDIAccess === 'function') {
    navigator.requestMIDIAccess({ sysex: false }).then((access) => {
      midi.access = access;
      access.onstatechange = () => { bindMidi(); toUi('midiInputs', { inputs: midiInputs(), selected: midi.selected }); };
      bindMidi();
      toUi('midiInputs', { inputs: midiInputs(), selected: midi.selected });
      const n = midiInputs().length;
      message(n ? `MIDI ready: ${n} input(s): ${midiInputs().map(i => i.name).join(', ')}` : 'MIDI ready: no devices found (plug one in, it appears automatically)');
    }).catch((e) => {
      toUi('midiInputs', { inputs: [], selected: 'all', error: true });
      message(`MIDI unavailable: ${e.message || e}`);
    });
  } else {
    queueMicrotask(() => toUi('midiInputs', { inputs: [], selected: 'all', error: true }));
  }

  // -------------------------------------------------------------- presets ---
  const LS_KEY = 'bk.userPresets.v1';
  const local = {
    read() { try { return JSON.parse(store.get(LS_KEY)) || {}; } catch (e) { return {}; } },
    write(obj) { return store.set(LS_KEY, JSON.stringify(obj)); },
  };
  const localPresets = () => Object.keys(local.read()).sort((a, b) => a.localeCompare(b, undefined, { numeric: true }))
    .map(name => ({ id: `local:${name}`, name, category: 'User', factory: false }));

  const fsSupported = typeof window.showDirectoryPicker === 'function';
  const folder = { handle: null, granted: false, files: [], sig: '' };
  const idb = {
    open() {
      return new Promise((res, rej) => {
        const r = indexedDB.open('brass-knuckles', 1);
        r.onupgradeneeded = () => r.result.createObjectStore('kv');
        r.onsuccess = () => res(r.result);
        r.onerror = () => rej(r.error);
      });
    },
    async get(key) {
      const db = await this.open();
      return new Promise((res) => { const r = db.transaction('kv').objectStore('kv').get(key); r.onsuccess = () => res(r.result); r.onerror = () => res(undefined); });
    },
    async set(key, val) {
      const db = await this.open();
      return new Promise((res) => { const tx = db.transaction('kv', 'readwrite'); tx.objectStore('kv').put(val, key); tx.oncomplete = () => res(true); tx.onerror = () => res(false); });
    },
  };

  async function scanFolder() {
    if (!folder.handle || !folder.granted) return false;
    const files = [];
    async function walk(dir, path) {
      for await (const [name, h] of dir.entries()) {
        const rel = path ? `${path}/${name}` : name;
        if (h.kind === 'directory') await walk(h, rel);
        else if (name.toLowerCase().endsWith(BK_PRESET_EXT)) {
          const f = await h.getFile();
          files.push({ id: `user:${rel}`, name: name.slice(0, -BK_PRESET_EXT.length), category: path || 'User',
                       factory: false, handle: h, parent: dir, fileName: name, stamp: `${f.size}:${f.lastModified}` });
        }
      }
    }
    try { await walk(folder.handle, ''); } catch (e) { folder.granted = false; return true; }
    files.sort((a, b) => a.category.localeCompare(b.category, undefined, { numeric: true }) || a.name.localeCompare(b.name, undefined, { numeric: true }));
    const sig = files.map(f => `${f.id}|${f.stamp}`).join(';');
    if (sig === folder.sig) return false;
    folder.sig = sig;
    folder.files = files;
    return true;
  }

  function allPresets() { return [...FACTORY, ...folder.files, ...localPresets()]; }
  function sendPresetList() {
    toUi('presetList', {
      presets: allPresets().map(({ id, name, category, factory }) => ({ id, name, category, factory })),
      folder: folder.granted ? `${folder.handle.name} (linked folder)` : 'this browser: click FOLDER to link a folder on disk',
    });
  }

  async function linkFolder(handle, ask) {
    folder.handle = handle;
    folder.sig = '';
    let state = await handle.queryPermission({ mode: 'readwrite' });
    if (state !== 'granted' && ask) state = await handle.requestPermission({ mode: 'readwrite' });
    folder.granted = state === 'granted';
    await idb.set('presetFolder', handle);
    if (folder.granted) await scanFolder();
    sendPresetList();
    return folder.granted;
  }
  if (fsSupported && window.indexedDB) {
    idb.get('presetFolder').then(async (h) => {
      if (h && !(await linkFolder(h, false))) message(`Click FOLDER to reconnect the preset folder "${h.name}"`);
    }).catch(() => {});
  }
  setInterval(async () => { if (await scanFolder()) sendPresetList(); }, 2000); // autoload, like the plugin

  // Same rules as PresetManager::readJson: migrate, then at least one known parameter.
  function parsePresetText(text, fallbackName) {
    let json;
    try { json = JSON.parse(text); } catch (e) { throw new Error(`Not a valid preset file: ${fallbackName}`); }
    if (!json || typeof json !== 'object') throw new Error(`Not a Brass Knuckles preset: ${fallbackName}`);
    bkMigratePreset(json);
    const params = {};
    if (bkApplyParamObject(json.params, params) === 0) throw new Error(`No Brass Knuckles settings found in ${fallbackName}`);
    return { name: String(json.name || '').trim() || fallbackName, category: String(json.category || ''), params };
  }
  function presetText(name, category) {
    const params = {};
    for (const d of PARAM_DEFS) if (!d.noPreset) params[d.id] = +Number(values[d.id]).toPrecision(6);
    return JSON.stringify({ format: BK_PRESET_FORMAT, version: BK_PRESET_VERSION, name, category, params }, null, 2);
  }
  const legalName = (s) => s.trim().replace(/[\\/:*?"<>|]/g, '_').slice(0, 60);

  async function loadPresetById(id) {
    const p = allPresets().find(x => x.id === id);
    if (!p) { message('Preset not found (was it moved or deleted?)'); toUi('preset', current); return; }
    try {
      const info = { id, name: p.name, category: p.category };
      if (p.factory) applyPreset(p.values, info);
      else {
        const text = id.startsWith('local:') ? local.read()[p.name] : await (await p.handle.getFile()).text();
        applyPreset(parsePresetText(text, p.name).params, info);
      }
    } catch (e) { message(e.message || String(e)); toUi('preset', current); }
  }

  async function savePreset(rawName, overwrite) {
    const name = legalName(rawName);
    const result = (r) => toUi('saveResult', Object.assign({ name, ok: false, exists: false, error: '' }, r));
    if (!name) return result({ error: 'Enter a name for the preset' });
    try {
      if (folder.granted) {
        const fileName = name + BK_PRESET_EXT;
        if (!overwrite) {
          let exists = true;
          try { await folder.handle.getFileHandle(fileName); } catch (e) { exists = false; }
          if (exists) return result({ exists: true });
        }
        const w = await (await folder.handle.getFileHandle(fileName, { create: true })).createWritable();
        await w.write(presetText(name, 'User'));
        await w.close();
        await scanFolder();
        current = { id: `user:${fileName}`, name, category: 'User' };
      } else {
        const all = local.read();
        if (!overwrite && all[name]) return result({ exists: true });
        all[name] = presetText(name, 'User');
        if (!local.write(all)) throw new Error('browser storage is unavailable (private window?)');
        current = { id: `local:${name}`, name, category: 'User' };
      }
      sendPresetList();
      toUi('preset', current);
      result({ ok: true });
    } catch (e) { result({ error: e.message || String(e) }); }
  }

  async function deletePreset(id) {
    const p = allPresets().find(x => x.id === id);
    try {
      if (!p || p.factory) throw new Error('Only user presets can be deleted');
      if (id.startsWith('local:')) { const all = local.read(); delete all[p.name]; local.write(all); }
      else { await p.parent.removeEntry(p.fileName); await scanFolder(); }
      if (current.id === id) current = { id: '', name: current.name, category: 'User' };
      message(`Deleted preset "${p.name}"`);
    } catch (e) { message(e.message || String(e)); }
    sendPresetList();
    toUi('preset', current);
  }

  const fileInput = document.createElement('input');
  fileInput.type = 'file';
  fileInput.accept = `${BK_PRESET_EXT},application/json`;
  fileInput.style.display = 'none';
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', () => document.body.appendChild(fileInput));
  else document.body.appendChild(fileInput);   // dev.html loads this after the document is ready
  fileInput.addEventListener('change', async () => {
    const f = fileInput.files && fileInput.files[0];
    fileInput.value = '';
    if (!f) return;
    try {
      const p = parsePresetText(await f.text(), f.name.replace(/\.[^.]+$/, ''));
      applyPreset(p.params, { id: `file:${f.name}`, name: p.name, category: 'File' });
      message(`Loaded ${f.name}`);
    } catch (e) { message(e.message || String(e)); }
  });

  async function folderButton() {
    if (!fsSupported) { message('Linking a preset folder needs Chrome or Edge: presets are saved in this browser instead.'); return; }
    try {
      if (folder.handle && !folder.granted) { if (await linkFolder(folder.handle, true)) message(`Reconnected "${folder.handle.name}"`); return; }
      const handle = await window.showDirectoryPicker({ id: 'bk-presets', mode: 'readwrite', startIn: 'documents' });
      await linkFolder(handle, true);
      message(`Preset folder linked: ${handle.name}, ${folder.files.length} preset(s). Link Documents\\Brass Knuckles\\Presets to share presets with the VST.`);
    } catch (e) { if (e && e.name !== 'AbortError') message(`Folder: ${e.message || e}`); }
  }

  // ------------------------------------------------- UI -> host events ---
  Object.assign(handlers, {
    uiReady() {
      sendConfig();
      sendPresetList();
      toUi('params', Object.assign({}, values));
      toUi('preset', current);
      toUi('stats', { voices: 0, peak: 0, sustain: false, modWheel: 0, bpm: tempo, breath: -1, expression: -1, aftertouch: -1,
                      dynamics: 0, bend: 0, plunger: values.mutePlunger, articulation: 0 });
      if (midi.access) toUi('midiInputs', { inputs: midiInputs(), selected: midi.selected });
    },
    paramMenu() {}, // no host automation menu in a browser
    setParam({ id, value }) {
      const d = PARAM_BY_ID[id];
      if (!d) return;
      let v = clamp(Number(value), d.min, d.max);
      if (d.step) v = Math.round(v / d.step) * d.step;
      values[id] = v;
      audio.post({ type: 'param', id, value: v });
    },
    gesture() {},
    // the on-screen keyboard plays MIDI channel 1, like the plugin's keyboard state
    noteOn({ note, vel }) { sendMidi([0x90, clamp(note | 0, 0, 127), clamp(vel | 0, 1, 127)]); noteShown(note | 0, true); },
    noteOff({ note }) { sendMidi([0x80, clamp(note | 0, 0, 127), 0]); noteShown(note | 0, false); },
    panic() { audio.post({ type: 'panic' }); allShownOff(); },
    modWheel({ value }) { audio.post({ type: 'modWheel', value: clamp(Number(value) || 0, 0, 1) }); },
    breath({ value }) { audio.post({ type: 'breath', value: Number(value) }); },
    articulation({ index }) { audio.post({ type: 'articulation', index: clamp(index | 0, 0, 5) }); },
    setTempo({ bpm }) { tempo = clamp(Number(bpm) || 120, 20, 300); store.set('bk.tempo', String(tempo)); audio.post({ type: 'tempo', bpm: tempo }); },
    selectMidi({ id }) { midi.selected = id; store.set('bk.midiInput', id); bindMidi(); },
    loadPreset({ id }) { loadPresetById(id); },
    savePreset({ name, overwrite }) { savePreset(String(name || ''), overwrite); },
    deletePreset({ id }) { deletePreset(id); },
    loadPresetFile() { fileInput.click(); },
    openPresetFolder() { folderButton(); },
  });

  // Test hook (tests/run-ui-tests.ps1): read-only view of the host state and a tap on what goes to the DSP.
  window.__bkWebHost = {
    values, factory: FACTORY, get current() { return current; }, get audioMode() { return audio.mode; },
    sent: [], tap: false,
  };
  const post = audio.post.bind(audio);
  audio.post = (m) => { if (window.__bkWebHost.tap) window.__bkWebHost.sent.push(m); post(m); };
})();

</script>
<script>
// ============================================================================
//  JUCE bridge: talks to the C++ processor through JUCE 8's native
//  integration (window.__JUCE__.backend). In the web build,
//  vst/webhost/web-host.js provides the same backend on top of Web Audio.
// ============================================================================
'use strict';

class JuceEngine {
  constructor() {
    this.backend = (window.__JUCE__ && window.__JUCE__.backend) || null;
    this.connected = !!this.backend;
    this.handlers = {};
    if (this.backend) {
      for (const ev of ['params', 'notes', 'stats', 'config', 'presetList', 'preset', 'saveResult', 'message', 'midiInputs']) {
        this.backend.addEventListener(ev, (data) => { if (this.handlers[ev]) this.handlers[ev](data); });
      }
    }
  }

  on(event, fn) { this.handlers[event] = fn; }
  emit(id, payload) { if (this.backend) this.backend.emitEvent(id, payload || {}); }

  uiReady() { this.emit('uiReady'); }

  // parameters
  setParam(id, value) { this.emit('setParam', { id, value }); }
  beginGesture(id) { this.emit('gesture', { id, begin: true }); }
  endGesture(id) { this.emit('gesture', { id, begin: false }); }

  // performance
  noteOn(note, vel) { this.emit('noteOn', { note, vel }); }
  noteOff(note) { this.emit('noteOff', { note }); }
  panic() { this.emit('panic'); }
  modWheel(value) { this.emit('modWheel', { value }); }
  breath(value) { this.emit('breath', { value }); }   // on-screen breath controller (sent as the Breath CC)
  articulation(index) { this.emit('articulation', { index }); } // latch one, same as its keyswitch

  // right-click on a control -> the host's parameter menu (automation, MIDI learn...)
  paramMenu(id, x, y) { this.emit('paramMenu', { id, x: Math.round(x), y: Math.round(y) }); }

  // web build only (the plugin takes tempo + MIDI from the host)
  setTempo(bpm) { this.emit('setTempo', { bpm }); }
  selectMidi(id) { this.emit('selectMidi', { id }); }

  // presets
  loadPreset(id) { this.emit('loadPreset', { id }); }
  savePreset(name, overwrite) { this.emit('savePreset', { name, overwrite: !!overwrite }); }
  deletePreset(id) { this.emit('deletePreset', { id }); }
  loadPresetFile() { this.emit('loadPresetFile'); }
  openPresetFolder() { this.emit('openPresetFolder'); }
}

// ============================================================================
//  SVG rotary knob.
//  Drag up/down (Shift = fine), mouse wheel, arrow keys, double-click = default.
//  270° sweep. Bipolar params draw their arc from 12 o'clock.
// ============================================================================
'use strict';

const KNOB_SWEEP = 135; // degrees either side of 12 o'clock

function svgPolar(cx, cy, r, deg) {
  const a = (deg - 90) * Math.PI / 180;
  return [cx + r * Math.cos(a), cy + r * Math.sin(a)];
}

function svgArc(cx, cy, r, a0, a1) {
  if (Math.abs(a1 - a0) < 0.5) return '';
  const lo = Math.min(a0, a1), hi = Math.max(a0, a1);
  const [x0, y0] = svgPolar(cx, cy, r, lo);
  const [x1, y1] = svgPolar(cx, cy, r, hi);
  const large = hi - lo > 180 ? 1 : 0;
  return `M${x0.toFixed(2)} ${y0.toFixed(2)} A${r} ${r} 0 ${large} 1 ${x1.toFixed(2)} ${y1.toFixed(2)}`;
}

class Knob {
  // onGesture(true/false) brackets a drag so the DAW records it as one automation gesture.
  constructor(def, value, onChange, onGesture) {
    this.def = def;
    this.onChange = onChange;
    this.onGesture = onGesture || null;
    this.value = value;
    this.drag = null;

    const el = document.createElement('div');
    el.className = 'knob';
    let ticks = '';
    if (def.type === 'choice') {
      const steps = def.max - def.min;
      for (let i = 0; i <= steps; i++) {
        const [x, y] = svgPolar(32, 32, 31, -KNOB_SWEEP + (2 * KNOB_SWEEP * i) / steps);
        ticks += `<circle class="k-tick" cx="${x.toFixed(2)}" cy="${y.toFixed(2)}" r="1.4"/>`;
      }
    }
    el.innerHTML = `
      <svg class="knob-svg" viewBox="0 0 64 64" tabindex="0" role="slider"
           aria-label="${def.name}" aria-valuemin="${def.min}" aria-valuemax="${def.max}">
        <path class="k-track" d="${svgArc(32, 32, 26, -KNOB_SWEEP, KNOB_SWEEP)}"/>
        ${ticks}
        <path class="k-value" d=""/>
        <circle class="k-face" cx="32" cy="32" r="19"/>
        <g class="k-rot"><line class="k-pointer" x1="32" y1="24" x2="32" y2="15"/></g>
      </svg>
      <div class="knob-value"></div>
      <div class="knob-label">${def.name}</div>`;
    this.el = el;
    this.svg = el.querySelector('svg');
    this.valuePath = el.querySelector('.k-value');
    this.rot = el.querySelector('.k-rot');
    this.readout = el.querySelector('.knob-value');
    this.bindEvents();
    this.render();
  }

  get norm() { return paramToNorm(this.def, this.value); }

  setValue(v, notify = false) {
    v = clamp(v, this.def.min, this.def.max);
    if (v === this.value) return;
    this.value = v;
    this.render();
    if (notify && this.onChange) this.onChange(v);
  }

  setNorm(n) { this.setValue(paramFromNorm(this.def, n), true); }

  nudge(dir, fine) {
    const d = this.def;
    if (d.step) this.setValue(this.value + dir * d.step, true);
    else this.setNorm(this.norm + dir * (fine ? 0.002 : 0.01));
  }

  render() {
    const d = this.def;
    const angle = -KNOB_SWEEP + this.norm * 2 * KNOB_SWEEP;
    const startAngle = d.bipolar ? 0 : -KNOB_SWEEP;
    this.valuePath.setAttribute('d', svgArc(32, 32, 26, startAngle, angle));
    this.rot.setAttribute('transform', `rotate(${angle.toFixed(2)} 32 32)`);
    this.readout.textContent = formatParam(d, this.value);
    this.svg.setAttribute('aria-valuenow', String(this.value));
    this.svg.setAttribute('aria-valuetext', formatParam(d, this.value));
  }

  bindEvents() {
    const svg = this.svg;
    svg.addEventListener('pointerdown', (e) => {
      e.preventDefault();
      svg.setPointerCapture(e.pointerId);
      svg.focus();
      this.drag = { y: e.clientY, norm: this.norm };
      this.el.classList.add('active');
      if (this.onGesture) this.onGesture(true);
    });
    svg.addEventListener('pointermove', (e) => {
      if (!this.drag) return;
      const dy = this.drag.y - e.clientY;
      this.drag.y = e.clientY;
      this.drag.norm = clamp(this.drag.norm + dy * (e.shiftKey ? 0.001 : 0.005), 0, 1);
      this.setNorm(this.drag.norm);
    });
    const end = () => {
      if (!this.drag) return;
      this.drag = null;
      this.el.classList.remove('active');
      if (this.onGesture) this.onGesture(false);
    };
    svg.addEventListener('pointerup', end);
    svg.addEventListener('pointercancel', end);
    svg.addEventListener('dblclick', () => this.setValue(this.def.def, true));
    svg.addEventListener('wheel', (e) => {
      e.preventDefault();
      this.nudge(e.deltaY < 0 ? 1 : -1, e.shiftKey);
    }, { passive: false });
    svg.addEventListener('keydown', (e) => {
      const dir = { ArrowUp: 1, ArrowRight: 1, ArrowDown: -1, ArrowLeft: -1 }[e.key];
      if (dir) { e.preventDefault(); e.stopPropagation(); this.nudge(dir, e.shiftKey); }
    });
  }
}

  <script>
// ============================================================================
//  Parameter controls besides the knob. Same conventions as Knob:
//  setValue(v) updates the display, onChange(v) fires on user edits.
//    ToggleButton - bool param   (click; double-click = default)
//    Segmented    - choice param (click; wheel / arrow keys step; double-click = default)
//    SelectBox    - choice param (native dropdown; wheel steps; double-click = default)
//    ModWheel     - SVG performance wheel (drag, wheel, arrow keys, double-click = 0)
// ============================================================================
'use strict';

class ToggleButton {
  constructor(def, value, onChange, label) {
    this.def = def;
    this.onChange = onChange;
    const b = document.createElement('button');
    b.type = 'button';
    b.className = 'power';
    b.innerHTML = `<span class="led"></span><span>${label || 'ON'}</span>`;
    b.addEventListener('click', () => this.onChange(this.value >= 0.5 ? 0 : 1));
    this.el = b;
    this.setValue(value);
  }
  setValue(v) {
    this.value = v;
    this.el.classList.toggle('on', v >= 0.5);
    this.el.setAttribute('aria-pressed', v >= 0.5);
  }
}

class Segmented {
  constructor(def, value, onChange, labels) {
    this.def = def;
    this.onChange = onChange;
    const wrap = document.createElement('div');
    wrap.className = 'seg';
    wrap.setAttribute('role', 'radiogroup');
    wrap.setAttribute('aria-label', def.name);
    this.buttons = (labels || def.choices).map((label, i) => {
      const b = document.createElement('button');
      b.type = 'button';
      b.textContent = label;
      b.setAttribute('role', 'radio');
      b.addEventListener('click', () => this.pick(i));
      wrap.appendChild(b);
      return b;
    });
    wrap.addEventListener('wheel', (e) => { e.preventDefault(); this.pick(this.value + (e.deltaY < 0 ? 1 : -1)); }, { passive: false });
    wrap.addEventListener('keydown', (e) => {
      const dir = { ArrowUp: 1, ArrowRight: 1, ArrowDown: -1, ArrowLeft: -1 }[e.key];
      if (dir) { e.preventDefault(); e.stopPropagation(); this.pick(this.value + dir); this.buttons[this.value].focus(); }
    });
    wrap.addEventListener('dblclick', () => this.pick(this.def.def));
    this.el = wrap;
    this.setValue(value);
  }
  pick(i) {
    i = clamp(Math.round(i), 0, this.buttons.length - 1);
    if (i !== this.value) this.onChange(i);
  }
  setValue(v) {
    this.value = clamp(Math.round(v), 0, this.buttons.length - 1);
    this.buttons.forEach((b, i) => { b.classList.toggle('on', i === this.value); b.setAttribute('aria-checked', i === this.value); });
  }
}

class SelectBox {
  constructor(def, value, onChange, labels) {
    this.def = def;
    this.onChange = onChange;
    const s = document.createElement('select');
    s.className = 'param-select';
    s.setAttribute('aria-label', def.name);
    (labels || def.choices).forEach((label, i) => s.appendChild(new Option(label, String(i))));
    s.addEventListener('change', () => this.onChange(Number(s.value)));
    s.addEventListener('wheel', (e) => {
      e.preventDefault();
      const i = clamp(this.value + (e.deltaY < 0 ? -1 : 1), 0, s.options.length - 1);
      if (i !== this.value) this.onChange(i);
    }, { passive: false });
    s.addEventListener('dblclick', () => { if (this.value !== this.def.def) this.onChange(this.def.def); });
    s.addEventListener('keydown', (e) => e.stopPropagation()); // arrow keys belong to the dropdown, not the piano
    this.el = s;
    this.setValue(value);
  }
  setValue(v) {
    this.value = clamp(Math.round(v), 0, this.el.options.length - 1);
    this.el.value = String(this.value);
  }
}

class ModWheel {
  // label / title: also used as the on-screen breath controller ("BREATH")
  constructor(onChange, onGesture, label, title) {
    this.onChange = onChange;
    this.onGesture = onGesture || null;
    this.value = 0;
    this.drag = null;
    const H = 110, W = 26, T = 16;
    this.H = H; this.T = T;
    const ridges = Array.from({ length: 14 }, (_, i) => `<line x1="4" x2="${W - 4}" y1="${6 + i * 7.5}" y2="${6 + i * 7.5}"/>`).join('');
    const el = document.createElement('div');
    el.className = 'wheel-ctl';
    el.innerHTML = `
      <svg class="wheel-svg" viewBox="0 0 ${W} ${H}" tabindex="0" role="slider" aria-label="${title || 'Mod wheel'}"
           aria-valuemin="0" aria-valuemax="127">
        <rect class="wh-slot" x="0.5" y="0.5" width="${W - 1}" height="${H - 1}" rx="5"/>
        <g class="wh-ridges">${ridges}</g>
        <rect class="wh-fill" x="3" width="${W - 6}" rx="3"/>
        <rect class="wh-thumb" x="2" width="${W - 4}" height="${T}" rx="3"/>
      </svg>
      <span class="ctl-label">${label || 'MOD'}</span>
      <span class="wheel-value">0</span>`;
    this.el = el;
    this.svg = el.querySelector('svg');
    this.thumb = el.querySelector('.wh-thumb');
    this.fill = el.querySelector('.wh-fill');
    this.readout = el.querySelector('.wheel-value');
    this.bind();
    this.render();
  }

  set(v, notify) {
    v = clamp(v, 0, 1);
    if (v === this.value) return;
    this.value = v;
    this.render();
    if (notify) this.onChange(v);
  }
  setValue(v) { if (!this.drag) this.set(v, false); }

  render() {
    const y = (this.H - this.T - 4) * (1 - this.value) + 2;
    this.thumb.setAttribute('y', y.toFixed(1));
    this.fill.setAttribute('y', (y + this.T / 2).toFixed(1));
    this.fill.setAttribute('height', Math.max(0, this.H - 3 - (y + this.T / 2)).toFixed(1));
    const midi = Math.round(this.value * 127);
    this.readout.textContent = midi;
    this.svg.setAttribute('aria-valuenow', String(midi));
  }

  bind() {
    const svg = this.svg;
    const fromY = (clientY) => {
      const r = svg.getBoundingClientRect();
      return 1 - (clientY - r.top - (this.T / 2) * (r.height / this.H)) / (r.height * (this.H - this.T) / this.H);
    };
    svg.addEventListener('pointerdown', (e) => {
      e.preventDefault();
      svg.setPointerCapture(e.pointerId);
      svg.focus();
      this.drag = { y: e.clientY, v: this.value };
      if (this.onGesture) this.onGesture(true);
      if (!e.shiftKey) this.set(fromY(e.clientY), true); // click jumps, Shift-drag is relative + fine
    });
    svg.addEventListener('pointermove', (e) => {
      if (!this.drag) return;
      if (e.shiftKey) {
        this.drag.v = clamp(this.drag.v + (this.drag.y - e.clientY) * 0.002, 0, 1);
        this.drag.y = e.clientY;
        this.set(this.drag.v, true);
      } else {
        this.drag.y = e.clientY;
        this.drag.v = fromY(e.clientY);
        this.set(this.drag.v, true);
      }
    });
    const end = () => { if (!this.drag) return; this.drag = null; if (this.onGesture) this.onGesture(false); };
    svg.addEventListener('pointerup', end);
    svg.addEventListener('pointercancel', end);
    svg.addEventListener('dblclick', () => this.set(0, true));
    svg.addEventListener('wheel', (e) => { e.preventDefault(); this.set(this.value + (e.deltaY < 0 ? 1 : -1) * (e.shiftKey ? 1 / 127 : 8 / 127), true); }, { passive: false });
    svg.addEventListener('keydown', (e) => {
      const dir = { ArrowUp: 1, ArrowRight: 1, ArrowDown: -1, ArrowLeft: -1 }[e.key];
      if (dir) { e.preventDefault(); e.stopPropagation(); this.set(this.value + dir * (e.shiftKey ? 1 / 127 : 8 / 127), true); }
    });
  }
}

  <script>
// ============================================================================
//  Envelope editor: an SVG graph of one oscillator envelope with draggable
//  handles. Each handle drives one or two parameters (x = a time, y = a level
//  or amount); drags are relative in the parameter's normalised range, so
//  log-scaled times feel even. Shift = fine. Double-click a handle = defaults.
//
//  kinds:  'amp'    Delay, Attack, Hold, Decay/Sustain, Release
//          'timbre' Delay, Attack, Decay/Sustain, Release
//          'pitch'  scoop start (cents), scoop time, blip (time + cents)
// ============================================================================
'use strict';

// Same as curveShape() in vst/Source/dsp/Common.h
function curveShape(p, c) {
  if (c > -1e-3 && c < 1e-3) return p;
  const k = 5 * c;
  return (1 - Math.exp(-k * p)) / (1 - Math.exp(-k));
}

class EnvGraph {
  // ctx: { get(id), set(id, v), begin(id), end(id) }
  constructor(prefix, kind, ctx) {
    this.prefix = prefix;
    this.kind = kind;
    this.ctx = ctx;
    this.drag = null;
    const el = document.createElement('div');
    el.className = 'env-graph';
    el.innerHTML = `<svg preserveAspectRatio="none"></svg><div class="eg-text"></div>`;
    this.el = el;
    this.svg = el.querySelector('svg');
    this.text = el.querySelector('.eg-text');
    this.bind();
  }

  id(f) { return this.prefix + f; }
  v(f) { return this.ctx.get(this.id(f)); }

  // display width of a segment of t seconds (log-ish, so 1 ms and 10 s both fit)
  static tw(t, seg) {
    if (t <= 0.0011) return 0;
    return seg * (0.08 + 0.92 * Math.log10(1 + t * 100) / Math.log10(1 + 1000));
  }

  layout(W, H) {
    const pad = 7, top = pad, bot = H - pad;
    const pts = [], handles = [];
    let text = '';
    const fmt = (f) => formatParam(PARAM_BY_ID[this.id(f)], this.v(f));
    const seg = (x0, x1, y0, y1, c) => {
      const n = Math.max(2, Math.round((x1 - x0) / 4));
      for (let i = 1; i <= n; i++) {
        const p = i / n;
        pts.push([x0 + (x1 - x0) * p, y0 + (y1 - y0) * curveShape(p, c)]);
      }
    };

    if (this.kind === 'amp' || this.kind === 'timbre') {
      const amp = this.kind === 'amp';
      const P = amp ? 'Amp' : 'TEnv';
      const dly = this.v(`${P}Dly`), atk = this.v(`${P}Atk`), hld = amp ? this.v('AmpHld') : 0;
      const dec = this.v(`${P}Dec`), sus = this.v(`${P}Sus`), rel = this.v(`${P}Rel`);
      const ac = amp ? this.v('AmpAtkCrv') : this.v('TEnvCrv');
      const dc = amp ? this.v('AmpDecCrv') : this.v('TEnvCrv');
      const rc = amp ? this.v('AmpRelCrv') : this.v('TEnvCrv');
      const S = (W - 2 * pad) * 0.2;
      const ys = bot - sus * (bot - top);
      let x = pad;
      pts.push([x, bot]);
      const xd = x + EnvGraph.tw(dly, S); pts.push([xd, bot]);
      const xa = xd + Math.max(2, EnvGraph.tw(atk, S)); seg(xd, xa, bot, top, ac);
      const xh = xa + EnvGraph.tw(hld, S); pts.push([xh, top]);
      const xs = xh + Math.max(2, EnvGraph.tw(dec, S)); seg(xh, xs, top, ys, dc);
      const xr0 = Math.max(xs + 10, W - pad - Math.max(2, EnvGraph.tw(rel, S)));
      pts.push([xr0, ys]);
      seg(xr0, W - pad, ys, bot, rc);
      handles.push({ x: xd, y: bot, xf: `${P}Dly` });
      handles.push({ x: xa, y: top, xf: `${P}Atk` });
      if (amp) handles.push({ x: xh, y: top, xf: 'AmpHld' });
      handles.push({ x: xs, y: ys, xf: `${P}Dec`, yf: `${P}Sus` });
      handles.push({ x: W - pad, y: bot, xf: `${P}Rel`, xRev: true });
      text = `A ${fmt(`${P}Atk`)}  D ${fmt(`${P}Dec`)}  S ${fmt(`${P}Sus`)}  R ${fmt(`${P}Rel`)}`;
      if (!amp) text = `${fmt('TEnvCut')} · ${text}`;
      return { pts, handles, text, zero: null };
    }

    // pitch: offset in cents over time; sign-preserving sqrt scale (±1200 ct)
    const mid = H / 2, half = H / 2 - pad;
    const yc = (c) => mid - Math.sign(c) * Math.sqrt(Math.min(1, Math.abs(c) / 1200)) * half;
    const amt = this.v('PEnvAmt'), T = this.v('PEnvTime'), crv = this.v('PEnvCrv');
    const blip = this.v('BlipAmt'), BT = this.v('BlipTime');
    const S = (W - 2 * pad) * 0.42;
    const xOf = (t) => pad + EnvGraph.tw(Math.max(t, 0.0012), S);
    const tEnd = Math.max(T, BT) * 1.6 + 0.02;
    const n = 90;
    for (let i = 0; i <= n; i++) {
      const t = tEnd * i / n;
      let c = amt * (1 - curveShape(Math.min(t / T, 1), crv));
      if (t < BT) c += blip * Math.sin(Math.PI * t / BT);
      pts.push([i === 0 ? pad : xOf(t), yc(c)]);
    }
    pts.push([W - pad, mid]);
    handles.push({ x: pad, y: yc(amt), yf: 'PEnvAmt' });
    handles.push({ x: xOf(T), y: mid, xf: 'PEnvTime' });
    handles.push({ x: xOf(BT / 2), y: yc(blip), xf: 'BlipTime', yf: 'BlipAmt' });
    text = `SCOOP ${fmt('PEnvAmt')} / ${fmt('PEnvTime')}  BLIP ${fmt('BlipAmt')}`;
    return { pts, handles, text, zero: mid };
  }

  render() {
    const W = this.el.clientWidth || 340, H = this.el.clientHeight || 92;
    this.W = W; this.H = H;
    const { pts, handles, text, zero } = this.layout(W, H);
    this.handles = handles;
    const line = 'M' + pts.map(p => `${p[0].toFixed(1)},${p[1].toFixed(1)}`).join(' L');
    const base = zero === null ? H - 7 : zero;
    const fill = `${line} L${pts[pts.length - 1][0].toFixed(1)},${base} L${pts[0][0].toFixed(1)},${base} Z`;
    const grid = [0.25, 0.5, 0.75].map(f => `<path class="eg-grid" d="M0 ${(H * f).toFixed(1)} H${W}"/>`).join('');
    this.svg.setAttribute('viewBox', `0 0 ${W} ${H}`);
    this.svg.innerHTML = `${grid}
      ${zero === null ? '' : `<path class="eg-zero" d="M0 ${zero} H${W}"/>`}
      <path class="eg-fill" d="${fill}"/><path class="eg-line" d="${line}"/>
      ${handles.map((h, i) => `<circle class="eg-handle${this.drag && this.drag.i === i ? ' drag' : ''}" data-h="${i}"
          cx="${h.x.toFixed(1)}" cy="${h.y.toFixed(1)}" r="4.5"/>`).join('')}`;
    this.text.textContent = text;
  }

  ids(h) { return [h.xf, h.yf].filter(Boolean).map(f => this.id(f)); }

  bind() {
    const svg = this.svg;
    svg.addEventListener('pointerdown', (e) => {
      const t = e.target.closest('[data-h]');
      if (!t) return;
      e.preventDefault();
      svg.setPointerCapture(e.pointerId);
      const i = Number(t.dataset.h), h = this.handles[i];
      const norm = (f) => f ? paramToNorm(PARAM_BY_ID[this.id(f)], this.v(f)) : 0;
      this.drag = { i, h, x: e.clientX, y: e.clientY, nx: norm(h.xf), ny: norm(h.yf), dx: 0, dy: 0 };
      this.ids(h).forEach(id => this.ctx.begin(id));
      this.render();
    });
    svg.addEventListener('pointermove', (e) => {
      const d = this.drag;
      if (!d) return;
      const k = e.shiftKey ? 0.2 : 1;
      // the panel may be scaled: convert screen pixels to graph pixels
      const r = this.el.getBoundingClientRect();
      const sx = this.W / Math.max(1, r.width), sy = this.H / Math.max(1, r.height);
      d.dx += (e.clientX - d.x) * sx * k; d.dy += (e.clientY - d.y) * sy * k;
      d.x = e.clientX; d.y = e.clientY;
      if (d.h.xf) {
        const def = PARAM_BY_ID[this.id(d.h.xf)];
        this.ctx.set(def.id, paramFromNorm(def, d.nx + (d.h.xRev ? -d.dx : d.dx) / (this.W * 0.45)));
      }
      if (d.h.yf) {
        const def = PARAM_BY_ID[this.id(d.h.yf)];
        this.ctx.set(def.id, paramFromNorm(def, d.ny - d.dy / (this.H - 14)));
      }
      this.render();
    });
    const end = () => {
      if (!this.drag) return;
      this.ids(this.drag.h).forEach(id => this.ctx.end(id));
      this.drag = null;
      this.render();
    };
    svg.addEventListener('pointerup', end);
    svg.addEventListener('pointercancel', end);
    svg.addEventListener('dblclick', (e) => {
      const t = e.target.closest('[data-h]');
      if (!t) return;
      const h = this.handles[Number(t.dataset.h)];
      this.ids(h).forEach(id => this.ctx.set(id, PARAM_BY_ID[id].def));
      this.render();

  <script>
// ============================================================================
//  SVG keyboard (default 49 keys). Click/touch to play, drag for glissando.
//  Velocity = how far down the key you click (lower = harder).
//  Extras for Brass Knuckles:
//   - keys outside the instrument's realistic range are dimmed (still playable)
//   - the keyswitch octave is coloured; arrows show where the range and the
//     keyswitches are when they're scrolled out of view
// ============================================================================
'use strict';

const BLACK_PCS = new Set([1, 3, 6, 8, 10]);

class Piano {
  constructor(container, { numKeys = 49, baseNote = 36, onNoteOn, onNoteOff }) {
    this.numKeys = numKeys;
    this.base = baseNote; // must be a C
    this.onNoteOn = onNoteOn;
    this.onNoteOff = onNoteOff;
    this.active = new Set();     // sounding MIDI notes (from any source)
    this.pointers = new Map();   // pointerId -> note
    this.range = null;           // [lo, hi] realistic range, or null
    this.ks = null;              // [lo, hi] keyswitch notes, or null
    this.ksActive = null;        // the latched articulation's keyswitch
    this.build(container);
  }

  build(container) {
    const WW = 28, WH = 150, BW = 17, BH = 92, TOP = 10;
    const whites = [], blacks = [];
    let wi = 0;
    this.keyX = [];
    for (let i = 0; i < this.numKeys; i++) {
      if (BLACK_PCS.has(i % 12)) {
        blacks.push(`<rect class="bkey" data-idx="${i}" x="${wi * WW - BW / 2}" y="${TOP}" width="${BW}" height="${BH}" rx="2"/>`);
        this.keyX.push(wi * WW);
      } else {
        whites.push(`<rect class="wkey" data-idx="${i}" x="${wi * WW + 1}" y="${TOP}" width="${WW - 2}" height="${WH}" rx="3"/>`);
        if (i % 12 === 0) whites.push(`<text class="klabel" data-label="${i}" x="${wi * WW + WW / 2}" y="${TOP + WH - 10}"></text>`);
        this.keyX.push(wi * WW + WW / 2);
        wi++;
      }
    }
    const W = wi * WW;
    this.W = W;
    container.innerHTML = `
      <svg class="piano-svg" viewBox="0 0 ${W} ${TOP + WH + 2}" preserveAspectRatio="xMidYMid meet">
        <rect class="felt" x="0" y="0" width="${W}" height="${TOP - 2}"/>
        <rect class="range-mark" data-mark="range" x="0" y="${TOP - 6}" width="0" height="3" rx="1.5"/>
        <rect class="ks-mark" data-mark="ks" x="0" y="${TOP - 6}" width="0" height="3" rx="1.5"/>
        ${whites.join('')}
        ${blacks.join('')}
      </svg>`;
    this.svg = container.querySelector('svg');
    this.keys = Array.from({ length: this.numKeys }, (_, i) => this.svg.querySelector(`[data-idx="${i}"]`));
    this.labels = Array.from(this.svg.querySelectorAll('[data-label]'));
    this.rangeMark = this.svg.querySelector('[data-mark="range"]');
    this.ksMark = this.svg.querySelector('[data-mark="ks"]');
    this.bindPointer();
    this.render();
  }

  setBase(note) { this.base = note; this.render(); }
  setRange(range) { this.range = range; this.render(); }
  setKeyswitches(ks) { this.ks = ks; this.render(); }
  setActiveKeyswitch(note) { this.ksActive = note; this.render(); }

  setNote(note, on) {
    if (on) this.active.add(note); else this.active.delete(note);
    const i = note - this.base;
    if (i >= 0 && i < this.numKeys) this.keys[i].classList.toggle('down', on);
  }

  clear() { this.active.clear(); this.render(); }

  // felt strip above the keys: where the range / keyswitches are (clipped to the view)
  markSpan(el, span) {
    if (!span) { el.setAttribute('width', 0); return; }
    const lo = Math.max(span[0], this.base), hi = Math.min(span[1], this.base + this.numKeys - 1);
    if (hi < lo) { el.setAttribute('width', 0); return; }
    const x0 = this.keyX[lo - this.base] - 8, x1 = this.keyX[hi - this.base] + 8;
    el.setAttribute('x', Math.max(0, x0).toFixed(1));
    el.setAttribute('width', Math.max(0, Math.min(this.W, x1) - Math.max(0, x0)).toFixed(1));
  }

  render() {
    this.keys.forEach((k, i) => {
      const n = this.base + i;
      k.classList.toggle('down', this.active.has(n));
      k.classList.toggle('out', !!this.range && (n < this.range[0] || n > this.range[1]));
      k.classList.toggle('ks', !!this.ks && n >= this.ks[0] && n <= this.ks[1]);
      k.classList.toggle('ks-active', this.ksActive === n);
    });
    this.labels.forEach(t => { t.textContent = midiNoteName(this.base + Number(t.dataset.label)); });
    this.markSpan(this.rangeMark, this.range);
    this.markSpan(this.ksMark, this.ks);
  }

  hit(x, y) {
    const t = document.elementFromPoint(x, y);
    if (!t || !this.svg.contains(t) || !t.dataset.idx) return null;
    const r = t.getBoundingClientRect();
    const depth = clamp((y - r.top) / r.height, 0, 1);
    return { note: this.base + Number(t.dataset.idx), vel: Math.round(25 + depth * 102) };
  }

  bindPointer() {
    const svg = this.svg;
    const press = (id, x, y) => {
      const h = this.hit(x, y);
      if (!h) return;
      this.pointers.set(id, h.note);
      this.onNoteOn(h.note, h.vel);
    };
    const lift = (id) => {
      const n = this.pointers.get(id);
      if (n !== undefined && n !== null) this.onNoteOff(n);
      this.pointers.delete(id);
    };
    svg.addEventListener('pointerdown', (e) => {
      e.preventDefault();
      svg.setPointerCapture(e.pointerId);
      press(e.pointerId, e.clientX, e.clientY);
    });
    svg.addEventListener('pointermove', (e) => {
      if (!this.pointers.has(e.pointerId)) return;
      const h = this.hit(e.clientX, e.clientY);
      const cur = this.pointers.get(e.pointerId);
      const next = h ? h.note : null;
      if (next === cur) return;
      // glissando: new key first, then release the old one, so legato presets slur
      if (h) this.onNoteOn(h.note, h.vel);
      if (cur !== null) this.onNoteOff(cur);
      this.pointers.set(e.pointerId, next);
    });
    svg.addEventListener('pointerup', (e) => lift(e.pointerId));
    svg.addEventListener('pointercancel', (e) => lift(e.pointerId));
  }
}

  <script>
// ============================================================================
//  UI wiring, shared by the plugin and the web build.
//   - talks only to JuceEngine (engine-juce.js). In the plugin that is JUCE's
//     native bridge to C++; in the web build vst/webhost/web-host.js provides
//     the same bridge on top of Web Audio + Web MIDI.
//   - the host owns all parameter state; automation, preset loads and MIDI
//     notes flow back in as events
//   - the whole panel scales to fit the window
// ============================================================================
(function () {
  'use strict';

  const $ = (sel) => document.querySelector(sel);
  function el(tag, cls, html) {
    const e = document.createElement(tag);
    if (cls) e.className = cls;
    if (html !== undefined) e.innerHTML = html;
    return e;
  }
  const store = {
    get(k) { try { return localStorage.getItem(k); } catch (e) { return null; } },
    set(k, v) { try { localStorage.setItem(k, v); } catch (e) { /* storage unavailable */ } },
  };

  // ---------------------------------------------------------------- state ---
  const values = defaultParamValues();      // replaced by the plugin's state on connect
  let presetList = [];                      // [{id, name, category, factory}] factory first, then user
  let presetFolder = '';
  let current = { id: '', name: '—', category: '' };
  let presetDirty = false;
  let activeCat = null;

  const engine = new JuceEngine();
  const knobs = {};
  const bound = {};             // id -> [controls with setValue()]
  const dragging = new Set();   // params being dragged in the UI
  const lastLocal = {};         // id -> time of last UI-side change
  const refreshers = [];        // functions run after values change: (changedIds:Set|null) => void

  // ---------------------------------------------------- parameter plumbing ---
  function applyValue(id, v) {
    values[id] = v;
    if (knobs[id]) knobs[id].setValue(v);
    (bound[id] || []).forEach(c => c.setValue(v));
  }

  function refresh(ids) { refreshers.forEach(fn => fn(ids)); }

  // A change made in this UI
  function setParam(id, v) {
    lastLocal[id] = performance.now();
    applyValue(id, v);
    engine.setParam(id, v);
    if (!PARAM_BY_ID[id].noPreset && !presetDirty) { presetDirty = true; renderPresetName(); }
    refresh(new Set([id]));
  }

  const gesture = {
    begin(id) { dragging.add(id); engine.beginGesture(id); },
    end(id) { dragging.delete(id); engine.endGesture(id); },
  };

  function addKnob(parent, id, size) {
    const k = new Knob(PARAM_BY_ID[id], values[id], (v) => setParam(id, v),
      (begin) => (begin ? gesture.begin(id) : gesture.end(id)));
    if (size) k.el.classList.add(size);
    knobs[id] = k;
    k.el.dataset.param = id;
    parent.appendChild(k.el);
    return k;
  }

  // Bind a non-knob control (ToggleButton / Segmented / SelectBox) to a param
  function control(Cls, id, ...extra) {
    const c = new Cls(PARAM_BY_ID[id], values[id], (v) => setParam(id, v), ...extra);
    (bound[id] = bound[id] || []).push(c);
    c.el.dataset.param = id;
    return c;
  }

  // Changes coming from the plugin (automation, presets, state restore)
  engine.on('params', (obj) => {
    const now = performance.now();
    const changed = new Set();
    for (const id in obj) {
      if (!PARAM_BY_ID[id]) continue;
      // don't fight the user's hand: skip params being dragged or changed here in the last 300 ms
      if (dragging.has(id) || (lastLocal[id] !== undefined && now - lastLocal[id] < 300)) continue;
      applyValue(id, obj[id]);
      changed.add(id);
    }
    if (changed.size) refresh(changed);
  });

  // ------------------------------------------------------------ presets ----
  const esc = (s) => String(s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

  engine.on('presetList', ({ presets, folder }) => {
    presetList = presets;
    presetFolder = folder;
    if (!activeCat || !categories().includes(activeCat)) activeCat = current.category || (presets[0] && presets[0].category);
    renderBrowser();
  });

  engine.on('preset', (p) => {
    const changed = p.id !== current.id || p.name !== current.name;
    current = p;
    if (changed) presetDirty = false;
    if (p.category && categories().includes(p.category)) activeCat = p.category;
    renderPresetName();
    renderBrowser();
  });

  engine.on('message', ({ text }) => logMidi(text));

  function categories() {
    const cats = [];
    for (const p of presetList) if (!cats.includes(p.category)) cats.push(p.category);
    if (!presetList.some(p => !p.factory) && !cats.includes('User')) cats.push('User');
    return cats;
  }

  function loadPreset(p) {
    presetDirty = false;
    current = { id: p.id, name: p.name, category: p.category };
    for (const id in lastLocal) delete lastLocal[id]; // let all incoming values through
    renderPresetName();
    renderBrowser();
    engine.loadPreset(p.id); // the plugin applies the values and sends them back
  }

  function stepPreset(dir) {
    if (!presetList.length) return;
    const i = presetList.findIndex(p => p.id === current.id);
    const next = i < 0 ? 0 : (i + dir + presetList.length) % presetList.length;
    loadPreset(presetList[next]);
  }

  function renderPresetName() {
    $('#preset-name').textContent = current.name + (presetDirty ? ' *' : '');
    $('#preset-cat').textContent = (current.category || 'Preset').toUpperCase();
  }

  const tabsEl = $('#cat-tabs');
  const gridEl = $('#preset-grid');
  function renderBrowser() {
    const cats = categories();
    tabsEl.innerHTML = '';
    for (const c of cats) {
      const t = el('button', 'cat-tab', esc(c));
      t.type = 'button';
      t.setAttribute('role', 'tab');
      t.setAttribute('aria-selected', c === activeCat);
      t.classList.toggle('active', c === activeCat);
      t.classList.toggle('has-current', c === current.category);
      t.addEventListener('click', () => { activeCat = c; renderBrowser(); });
      tabsEl.appendChild(t);
    }
    gridEl.innerHTML = '';
    const items = presetList.filter(p => p.category === activeCat);
    if (!items.length) {
      gridEl.appendChild(el('div', 'grid-empty',
        `No user presets yet. Click <b>SAVE</b> to store the current sound.<br>
         Preset files in <span class="path">${esc(presetFolder)}</span> show up here automatically.`));
      return;
    }
    for (const p of items) {
      const b = el('button', 'preset-btn', `<span class="pb-name">${esc(p.name)}</span>`);
      b.type = 'button';
      b.title = p.name;
      b.classList.toggle('selected', p.id === current.id);
      b.addEventListener('click', () => loadPreset(p));
      if (!p.factory) {
        const del = el('span', 'pb-del', '×');
        del.title = 'Delete preset';
        del.addEventListener('click', (e) => {
          e.stopPropagation();
          openModal({
            title: 'Delete preset', body: `Move <b>${esc(p.name)}</b> to the Recycle Bin?`,
            ok: 'DELETE', danger: true, onOk: () => engine.deletePreset(p.id),
          });
        });
        b.appendChild(del);
      }
      gridEl.appendChild(b);
    }
  }

  function savePrompt() {
    openModal({
      title: 'Save preset',
      body: `Saved to <span class="path">${esc(presetFolder)}</span>`,
      input: current.category === 'User' || !current.id.startsWith('factory:') ? current.name : `${current.name} (copy)`,
      ok: 'SAVE',
      onOk: (name) => { if (name.trim()) engine.savePreset(name.trim(), false); },
    });
  }
  engine.on('saveResult', ({ ok, exists, name, error }) => {
    if (ok) { presetDirty = false; renderPresetName(); logMidi(`Saved preset "${name}"`); }
    else if (exists) {
      openModal({
        title: 'Replace preset?', body: `A preset named <b>${esc(name)}</b> already exists. Replace it?`,
        ok: 'REPLACE', danger: true, onOk: () => engine.savePreset(name, true),
      });
    } else logMidi(`Save failed: ${error}`);
  });

  $('#preset-prev').addEventListener('click', () => stepPreset(-1));
  $('#preset-next').addEventListener('click', () => stepPreset(1));
  $('#preset-save').addEventListener('click', savePrompt);
  $('#preset-load').addEventListener('click', () => engine.loadPresetFile());
  $('#preset-folder').addEventListener('click', () => engine.openPresetFolder());

  // ------------------------------------------------------------- modal -----
  const modal = $('#modal'), modalInput = $('#modal-input'), modalOk = $('#modal-ok');
  let modalOnOk = null;
  function openModal({ title, body, input, ok, danger, onOk }) {
    $('#modal-title').textContent = title;
    $('#modal-body').innerHTML = body || '';
    modalOk.textContent = ok || 'OK';
    modalOk.classList.toggle('danger', !!danger);
    modalInput.style.display = input === undefined ? 'none' : '';
    modalInput.value = input || '';
    modalOnOk = onOk;
    modal.classList.remove('hidden');
    if (input !== undefined) { modalInput.focus(); modalInput.select(); } else modalOk.focus();
  }
  function closeModal(accept) {
    if (modal.classList.contains('hidden')) return;
    modal.classList.add('hidden');
    const fn = modalOnOk;
    modalOnOk = null;
    if (accept && fn) fn(modalInput.value);
  }
  modalOk.addEventListener('click', () => closeModal(true));
  $('#modal-cancel').addEventListener('click', () => closeModal(false));
  modal.addEventListener('pointerdown', (e) => { if (e.target === modal) closeModal(false); });
  modal.addEventListener('keydown', (e) => {
    e.stopPropagation(); // typing a name must not play notes
    if (e.key === 'Enter') { e.preventDefault(); closeModal(true); }
    else if (e.key === 'Escape') { e.preventDefault(); closeModal(false); }
  });
  modal.addEventListener('keyup', (e) => e.stopPropagation());

  // ------------------------------------------------------------- pages -----
  const PAGE_HINTS = {
    play: 'Dynamics: velocity, breath (CC2), expression, aftertouch → loudness, brightness and attack',
    osc: 'Each oscillator has its own Amp, Pitch and Timbre envelopes · drag the points, Shift = fine',
    harm: '32 harmonics, each with its own envelope: upper harmonics arrive later and fade first',
    tone: 'Brassiness grows with dynamics · body and mute filters follow the instrument',
    attack: 'How each note starts and breathes',
    perform: 'Keyswitches latch an articulation · section players · analog unison · MPE',
    mod: 'Two LFOs and 12 routes: any source x via -> any destination',
    fx: 'Drive -> EQ -> chorus -> reverb -> width, after the patch level',
  };
  let activePage = location.hash.slice(1) || store.get('bk.page') || 'play'; // #osc opens a page directly (tests)
  function showPage(name) {
    if (!PAGE_HINTS[name]) name = 'play';
    activePage = name;
    store.set('bk.page', name);
    document.querySelectorAll('.page-tab').forEach(t => t.classList.toggle('active', t.dataset.page === name));
    document.querySelectorAll('.page').forEach(p => p.classList.toggle('active', p.dataset.page === name));
    $('#page-hint').textContent = PAGE_HINTS[name];
    refresh(null); // graphs measure their size when visible
  }
  document.querySelectorAll('.page-tab').forEach(t => t.addEventListener('click', () => showPage(t.dataset.page)));

  function makePanel(title, extraHeader) {
    const p = el('div', 'panel');
    const h = el('div', 'panel-head', `<span class="panel-title">${title}</span>`);
    if (extraHeader) (Array.isArray(extraHeader) ? extraHeader : [extraHeader]).forEach(x => h.appendChild(x));
    p.appendChild(h);
    return p;
  }
  function knobRow(parent, ids, size, cls) {
    const row = el('div', 'knob-row' + (cls ? ' ' + cls : ''));
    ids.forEach(id => addKnob(row, id, size));
    parent.appendChild(row);
    return row;
  }
  function field(label, ctl) {
    const f = el('div', 'field', `<span class="ctl-label">${label}</span>`);
    f.appendChild(ctl.el);
    return f;
  }

  // ========================================================== PLAY page ====
  const row1 = $('#play-row-1'), row2 = $('#play-row-2');

  // ---- instrument
  {
    const p = makePanel('INSTRUMENT');
    const grid = el('div', 'field-grid');
    grid.appendChild(field('Instrument', control(SelectBox, 'instrument')));
    grid.appendChild(field('Engine', control(Segmented, 'engineMode')));
    p.appendChild(grid);
    knobRow(p, ['ampLevel', 'tune', 'transpose']);

      dynUi[key] = { root: s, fill: s.querySelector('.dyn-bar > div') };
    };
    bar('breath', 'BREATH', 'Breath controller (the Breath CC, default CC2)');
    bar('expression', 'EXPR', 'Expression (CC11)');
    bar('aftertouch', 'AFTT', 'Channel aftertouch');
    bar('bend', 'BEND', 'Pitch bend');
    bar('dynamics', 'DYN', 'Resulting dynamics of the latest note');
    dynUi.dynamics.root.classList.add('out');
    const curves = el('div', 'dyn-curves', `
      <svg viewBox="0 0 100 60" preserveAspectRatio="none">
        <path class="scr-grid" d="M0 30 H100"/>
        <path class="dc-loud" d=""/><path class="dc-bright" d=""/><path class="dc-now" d=""/>
      </svg>
      <div class="dc-legend"></div>`);
    scr.appendChild(curves);
    dynUi.loud = curves.querySelector('.dc-loud');
    dynUi.bright = curves.querySelector('.dc-bright');
    dynUi.now = curves.querySelector('.dc-now');
    dynUi.legend = curves.querySelector('.dc-legend');
    p.appendChild(scr);
    knobRow(p, ['dynRange', 'dynBright', 'dynBrCurve', 'dynCurve', 'dynAttack', 'dynSmooth'], 'knob-md');
    knobRow(p, ['dynBreath', 'dynExpr', 'dynAT', 'dynMPE', 'dynVel', 'dynBreathCC'], 'knob-md');
    row1.appendChild(p);
  }
  function responseCurve(x, c) { return Math.abs(c) < 1e-3 ? x : Math.pow(x, Math.pow(2, 2 * c)); }
  function refreshDynCurves() {
    const N = 40, loud = [], bright = [];
    const range = values.dynRange, oct = values.dynBright;
    for (let i = 0; i <= N; i++) {
      const x = i / N, d = responseCurve(x, values.dynCurve);
      const db = -range * (1 - d) + (d < 0.05 ? 20 * Math.log10(Math.max(d / 0.05, 1e-3)) : 0);

    dynUi.bright.setAttribute('d', 'M' + bright.join(' L'));

  }
  refreshers.push(refreshDynCurves);

  // ---- vibrato
  {
    const p = makePanel('VIBRATO');
    knobRow(p, ['vibDepth', 'vibAmp', 'vibRate', 'vibDelay'], 'knob-md');
    knobRow(p, ['vibFade', 'vibDrift', 'vibWheel'], 'knob-md');
    row2.appendChild(p);
  }

  // ---- voice / glide
  {
    const p = makePanel('VOICE · GLIDE', control(Segmented, 'voiceMode').el);
    const sw = el('div', 'switch-row left');
    sw.appendChild(control(ToggleButton, 'glideOn', 'GLIDE').el);
    sw.appendChild(control(Segmented, 'glideMode', ['ALWAYS', 'LEGATO']).el);
    p.appendChild(sw);
    knobRow(p, ['glideTime', 'glideCurve', 'slurDip', 'polyphony', 'bendRange'], 'knob-md');
    row2.appendChild(p);
  }

  // ---- output
  {
    const p = makePanel('OUTPUT');
    p.appendChild(el('div', 'screen voice-screen', `
      <div class="vs-row"><span class="vs-label">NOTES</span><span class="vs-value"><b id="voice-count">0</b>/<span id="voice-max">32</span></span></div>
      <div class="meter"><div id="meter-fill"></div><div class="meter-clip"></div></div>`));
    knobRow(p, ['master']);
    row2.appendChild(p);
  }
  refreshers.push(() => { $('#voice-max').textContent = values.voiceMode >= 0.5 ? 1 : Math.round(values.polyphony); });

  // ===================================================== OSCILLATORS page ===
  function shapePath(shape, pw, w, h) {
    const N = 200, pad = 5, pts = [];
    const i0 = Math.min(2, Math.floor(shape)), f = shape - i0;
    const wave = (i, t) => {
      if (i === 1) return 1 - 4 * Math.abs(((t + 0.25) % 1) - 0.5);
      if (i === 2) return 2 * t - 1;
      if (i === 3) return (t < pw ? 1 : -1) - (2 * pw - 1);
      return Math.sin(2 * Math.PI * t);
    };
    for (let i = 0; i <= N; i++) {
      const x = i / N, t = (x * 2) % 1;
      let y = wave(i0, t);
      if (f > 1e-6) y += (wave(i0 + 1, t) - y) * f;

    // node envelope attacks over the first 400 ms (same timing maths as the engine)

      const [W, H] = graphSize(timing);
      const T = 0.4, nodes = [0, 3, 5, 7];   // harmonics 1, 4, 9, 21
      const cls = ['gr-line', 'gr-line mid', 'gr-line dim', 'gr-line dim'];
      let paths = '';
      nodes.forEach((j, idx) => {
        const x = Math.log2(ADD_NODE_HARMONIC[j]) / 5;
        const w0 = clamp(1 - x / 0.45, 0, 1), w2 = clamp((x - 0.55) / 0.45, 0, 1), w1 = 1 - w0 - w2;
        const b = (f) => w0 * values[`addLo${f}`] + w1 * values[`addMid${f}`] + w2 * values[`addHi${f}`];
        const dly = values.addSpecDly * 0.08 * Math.pow(x, 0.8);
        const atk = b('Atk') * (1 + 1.5 * values.addSpecDly * x), dec = b('Dec'), sus = b('Sus'), lvl = b('Lvl');

          }
          pts.push(`${(t / T * W).toFixed(1)},${(H - 14 - e * lvl * (H - 24)).toFixed(1)}`);
        }
        paths += `<path class="${cls[idx]}" d="M${pts.join(' L')}"/>`;
      });

      timing.svg.setAttribute('viewBox', `0 0 ${W} ${H}`);
